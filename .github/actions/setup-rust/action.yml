---
name: Setup Rust
description: Install the repository-pinned Rust toolchain and an optional cross-compilation target

inputs:
  target:
    description: Optional Rust compilation target to add to the active repository toolchain
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install repository Rust toolchain
      shell: bash
      env:
        RUST_TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail

        RUST_TOOLCHAIN="$(sed -nE 's/^channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml)"
        if [ -z "$RUST_TOOLCHAIN" ]; then
          echo "rust-toolchain.toml does not declare a toolchain channel" >&2
          exit 1
        fi

        # Recent rustup requires an explicit toolchain. Read the repository pin once
        # and use it for both installation and optional target addition.
        rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
        if [ -n "$RUST_TARGET" ]; then
          rustup target add "$RUST_TARGET" --toolchain "$RUST_TOOLCHAIN"
        fi

        rustup show active-toolchain
        rustc --version --verbose
