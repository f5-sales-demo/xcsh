name: Profile xcsh runner workload
description: Run redacted xcsh phase profiling with deterministic evidence
inputs:
  experiment:
    description: Independently promoted experiment side
    required: true
  cache-state:
    description: Cold or warm package and build cache state
    required: true
  pair-id:
    description: Stable matched-pair identifier
    required: true
  file-workers:
    description: Zero for serial files or exactly two Bun file workers
    required: true
  expected-image-digest:
    description: Exact immutable runner image reference
    required: true
  phase-set:
    description: Workload phases to profile (all, native, rust, or typescript)
    required: false
    default: all
  evidence-suffix:
    description: Unique artifact suffix for split workflow jobs
    required: false
    default: all
runs:
  using: composite
  steps:
    - name: Verify immutable runner identity
      shell: bash
      env:
        EXPECTED_IMAGE_DIGEST: ${{ inputs.expected-image-digest }}
      run: |
        set -euo pipefail
        test "${RUNNER_IMAGE_DIGEST:?RUNNER_IMAGE_DIGEST is required}" = "$EXPECTED_IMAGE_DIGEST"
        test "$(command -v runner-profile)" = /usr/local/bin/runner-profile
    - name: Profile legacy setup or baked verification
      shell: bash
      env:
        PROFILE_CACHE_STATE: ${{ inputs.cache-state }}
        PROFILE_EXPERIMENT: ${{ inputs.experiment }}
        PROFILE_PAIR_ID: ${{ inputs.pair-id }}
        PROFILE_PHASE_SET: ${{ inputs.phase-set }}
      run: |
        "${{ github.action_path }}/../../../scripts/prepare-runner-optimization-toolchain.sh" \
          "$PROFILE_EXPERIMENT" "$PROFILE_CACHE_STATE" "$PROFILE_PAIR_ID" \
          "$RUNNER_TEMP/runner-profile-evidence" \
          "${{ github.action_path }}/../../../scripts/verify-self-hosted-tools.sh" \
          "$PROFILE_PHASE_SET"
    - name: Restore exact warm Rust cache
      if: inputs.cache-state == 'warm'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
    - name: Profile workload phases
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PROFILE_CACHE_STATE: ${{ inputs.cache-state }}
        PROFILE_EXPERIMENT: ${{ inputs.experiment }}
        PROFILE_FILE_WORKERS: ${{ inputs.file-workers }}
        PROFILE_PAIR_ID: ${{ inputs.pair-id }}
        PROFILE_PHASE_SET: ${{ inputs.phase-set }}
        XCSH_TEST_RUNNER: ${{ github.action_path }}/../../../scripts/run-ts-tests.ts
      run: |
        "${{ github.action_path }}/../../../scripts/runner-optimization-profile.sh" \
          "$PROFILE_EXPERIMENT" "$PROFILE_CACHE_STATE" "$PROFILE_PAIR_ID" \
          "$PROFILE_FILE_WORKERS" "$RUNNER_TEMP/runner-profile-evidence" \
          "$PROFILE_PHASE_SET"
    - name: Upload redacted workload evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: workload-profile-${{ inputs.experiment }}-${{ inputs.cache-state }}-${{ inputs.pair-id }}-${{ inputs.evidence-suffix }}
        path: ${{ runner.temp }}/runner-profile-evidence
        if-no-files-found: error
        retention-days: 30
