name: Profile xcsh runner workload
description: Run redacted xcsh phase profiling with deterministic evidence
inputs:
  mode:
    description: Full qualification or PR-shaped burst
    required: true
  variant:
    description: Evidence variant consumed by runner-profile
    required: true
  comparison:
    description: Software, hardware, or burst comparison class
    required: true
  cache-state:
    description: Cold or warm package/build cache state
    required: true
  pair-id:
    description: Stable matched-pair identifier
    required: true
runs:
  using: composite
  steps:
    - name: Verify immutable candidate identity
      shell: bash
      env:
        EXPECTED_BUN: ${{ inputs.variant == 'baseline' && inputs.comparison != 'hardware' && '1.3.14' || '1.4.2' }}
      run: |
        set -euo pipefail
        test "$(command -v runner-profile)" = /usr/local/bin/runner-profile
        test "$(command -v bun)" = /usr/local/bin/bun
        test "$(bun --version)" = "$EXPECTED_BUN"
        [[ "$RUNNER_IMAGE_DIGEST" =~ ^(ghcr\.io/f5-sales-demo|f5salesdemoarcca\.azurecr\.io)/self-hosted-runner@sha256:[0-9a-f]{64}$ ]]
    - uses: ./.github/actions/setup-rust
    - name: Set up Zig 0.15.2
      uses: ./.github/actions/setup-zig
    - name: Install repository test runner
      uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
      with:
        tool: nextest
    - name: Download immutable release native fixtures
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: qualification-native-*
        path: packages/natives/native
        merge-multiple: true
    - name: Restore exact warm Rust cache
      if: inputs.cache-state == 'warm'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
    - name: Profile workload phases
      shell: bash
      env:
        PROFILE_MODE: ${{ inputs.mode }}
        PROFILE_VARIANT: ${{ inputs.variant }}
        PROFILE_COMPARISON: ${{ inputs.comparison }}
        PROFILE_CACHE_STATE: ${{ inputs.cache-state }}
        PROFILE_PAIR_ID: ${{ inputs.pair-id }}
      run: |
        scripts/runner-optimization-profile.sh \
          "$PROFILE_MODE" "$PROFILE_VARIANT" "$PROFILE_COMPARISON" \
          "$PROFILE_CACHE_STATE" "$PROFILE_PAIR_ID" \
          "$RUNNER_TEMP/runner-profile-evidence"
    - name: Upload redacted workload evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: workload-profile-${{ inputs.comparison }}-${{ inputs.variant }}-${{ inputs.cache-state }}-${{ inputs.pair-id }}
        path: ${{ runner.temp }}/runner-profile-evidence
        if-no-files-found: error
        retention-days: 30
