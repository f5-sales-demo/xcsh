---
name: GitHub Pages Deploy
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  # Queue Pages deployments; never cancel an in-flight deploy. Cancelling mid-
  # deploy leaves the Pages backend with a superseded deployment and the next
  # run fails with "Deployment failed, try again later" (see actions/deploy-pages).
  cancel-in-progress: false

jobs:
  docs:
    uses: f5-sales-demo/docs-control/.github/workflows/github-pages-deploy.yml@5fd67d18c6384addd302d8a93a9dec0a5ff04da0
    with:
      builder-image: ghcr.io/f5-sales-demo/docs-builder@sha256:8fcc5e4171f6b4cb44133e44619aaca352d168b5a34e0c95a5715041d721bcda
      shared-mode: consume
      content-ref: ${{ github.sha }}
      socketless_runner_label: xcsh-socketless
      container_build_runner_label: xcsh-container-build
    permissions:
      contents: read # read documentation sources
      packages: read # pull the fleet documentation builder image
      pages: write # publish the built Pages artifact
      id-token: write # authenticate the Pages deployment
