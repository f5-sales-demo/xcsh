---
name: Tag on version bump

# Fires on every push to main. When the head commit is a version-bump commit
# produced by scripts/release.ts (`chore: bump version to v<X.Y.Z>` with an
# optional ` (#PR)` suffix appended by GitHub squash-merges), extract the
# version and push the git tag `v<X.Y.Z>`. The tag push is not subject to
# branch protection, so this step always succeeds and triggers the tag-gated
# release chain (build-release / build-sign-macos / create-release /
# publish-npm / update-homebrew / verify-npm-install / verify-homebrew-install)
# defined in ci.yml.
#
# Also supports workflow_dispatch for retroactive tagging: supply a
# `commit_sha` whose subject matches the bump pattern, and this workflow will
# tag that commit (useful when a prior run failed and you need to backfill).
#
# See docs-control onboarding: "Release automation: release PR pattern".
#
# Security: both github.event.head_commit.message and the workflow_dispatch
# input SHA are untrusted. They are only used via `env:` redirection (never
# direct `${{ }}` interpolation inside run steps), and the extracted tag is
# captured from a bash regex that matches v<X.Y.Z> strictly before any
# downstream git call -- shell metacharacters cannot enter the git tag /
# git push commands.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA on main to tag (leave blank to tag HEAD)'
        required: false
        type: string

permissions: {}

concurrency:
  group: tag-on-version-bump
  cancel-in-progress: false

jobs:
  tag:
    environment: release
    name: Create immutable release tag
    # push path: only run when the head commit starts with the bump prefix.
    # workflow_dispatch path: always run (the extract step validates input).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'chore: bump version to v')
    runs-on: [self-hosted, Linux, X64, xcsh, ubuntu-24.04]
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      # Needed only by the release-chain verification step below. The script it
      # runs has no imports, so the bun binary alone is enough — no `bun install`.
      #
      # Pinned to an immutable commit rather than the `v2` tag this repo uses
      # elsewhere: this job holds RELEASE_TOKEN, so a third-party action that
      # could be repointed at new code is a privileged place to accept that risk.
      # The rest of the repo pins nothing (including `@nightly` and org workflows
      # at `@main`) — that wider gap is its own problem, not one to solve here.
      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"

      - name: Resolve target commit SHA
        id: target
        env:
          INPUT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_SHA:-}" ]; then
            if [[ ! "$INPUT_SHA" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "Input commit_sha is not a valid hex SHA: $INPUT_SHA"
              exit 1
            fi
            sha=$(git rev-parse "$INPUT_SHA")
          else
            sha="$GITHUB_SHA"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Target commit: $sha"

      - name: Extract and validate version tag
        id: v
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          subject=$(git log -1 --format=%s "$SHA")
          # Match "chore: bump version to vX.Y.Z" with an optional trailing
          # ` (#N)` or other whitespace-prefixed suffix that GitHub appends on
          # squash-merges. Capture just the version.
          if [[ "$subject" =~ ^chore:\ bump\ version\ to\ (v[0-9]+\.[0-9]+\.[0-9]+)([[:space:]].*)?$ ]]; then
            tag="${BASH_REMATCH[1]}"
          else
            echo "Commit $SHA subject did not match the bump pattern:"
            echo "  $subject"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Extracted tag: $tag (from $SHA)"

      - name: Enable and require immutable releases before tagging
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method PUT "repos/${REPOSITORY}/immutable-releases" >/dev/null
          gh api "repos/${REPOSITORY}/immutable-releases" \
            | jq -e '.enabled == true' >/dev/null || {
            echo "::error::Repository release immutability must be enabled before tagging"
            exit 1
          }

      - name: Guard against duplicate tag
        id: guard
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists locally; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists on origin; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}" "${SHA}"
          # Retry ONLY the push: a transient GitHub failure (e.g. HTTP 500) must not
          # fail the job and strand the repo bumped-but-untagged. Create the tag once
          # above; push with bounded exponential backoff (5 attempts, delays 5/10/20/40s
          # between them).
          attempt=1
          max_attempts=5
          delay=5
          until git push origin "${TAG}"; do
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "::error::Failed to push tag ${TAG} after ${max_attempts} attempts. The bump commit ${SHA} is untagged; re-run this workflow via workflow_dispatch with commit_sha=${SHA} once GitHub recovers."
              exit 1
            fi
            echo "Tag push attempt ${attempt} failed; retrying in ${delay}s…"
            sleep "${delay}"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
          # Deliberately does NOT claim the release chain will fire — a push can
          # exit 0 having emitted no event at all. The next step establishes that.
          echo "Pushed tag ${TAG} -> ${SHA}."

      # Runs whether or not the push was skipped, and that is the point. A push
      # that half-fails (GitHub writes the ref, then errors) leaves the tag on
      # origin with NO push event; the retry then reports `Everything up-to-date`,
      # which is indistinguishable from success. Re-running this workflow cannot
      # recover it either — the duplicate-tag guard above sees the tag and skips
      # the push, so nothing ever emits an event again. Assert the post-condition
      # that actually matters instead: a CI run exists for the tag. (#2487)
      - name: Verify the release chain actually fired
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: bun scripts/ci-ensure-tag-release-run.ts "${TAG}"
