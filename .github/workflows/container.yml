---
name: Container

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  trust-gate:
    name: Trust Docker-capable job
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: xcsh-socketless
    permissions: {}
    steps:
      - name: Confirm this runner has no Docker socket
        run: test ! -S /run/docker.sock

  container-build:
    name: container-build (native-amd64)
    needs: trust-gate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: xcsh-container-build
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container
          name: xcsh-container-build-cache
          use: true
          cleanup: false

      - name: Test native Alpine container
        run: |
          bash ./scripts/tdd-docker.sh

  podman-uat-harness:
    name: podman-uat-harness
    needs: trust-gate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: xcsh-container-build
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test ARM64 Podman UAT harness
        run: bash ./scripts/test-uat-podman-arm64.sh

  container-test:
    name: container-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: [trust-gate, container-build, podman-uat-harness]
    runs-on: xcsh-container-build
    timeout-minutes: 5
    steps:
      - name: Require architecture and harness tests
        env:
          CONTAINER_BUILD_RESULT: ${{ needs.container-build.result }}
          PODMAN_HARNESS_RESULT: ${{ needs.podman-uat-harness.result }}
        run: |
          test "$CONTAINER_BUILD_RESULT" = success
          test "$PODMAN_HARNESS_RESULT" = success

  publish-ghcr-amd64:
    name: publish-ghcr (native-amd64)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [container-test]
    runs-on: xcsh-container-build
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # required to publish the release image to GHCR
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container
          name: xcsh-container-build-cache
          use: true
          cleanup: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and publish native AMD64 image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.alpine
          target: runtime
          platforms: linux/amd64
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            XCSH_BUILD_COMMIT=${{ github.sha }}
            XCSH_BUILD_TAG=${{ github.ref_name }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Verify native AMD64 image and write digest receipt
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_MACHINE: x86_64
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$(docker run --rm --entrypoint uname "$IMAGE@$DIGEST" -m)" = "$EXPECTED_MACHINE"
          test "$(docker run --rm "$IMAGE@$DIGEST" --version)" = "xcsh/${GITHUB_REF_NAME#v}"
          receipt_dir="$RUNNER_TEMP/ghcr-digest-amd64"
          mkdir -p "$receipt_dir"
          jq -n \
            --arg architecture amd64 \
            --arg platform linux/amd64 \
            --arg digest "$DIGEST" \
            --arg source_sha "$GITHUB_SHA" \
            --arg version "$GITHUB_REF_NAME" \
            '{schema_version: 1, architecture: $architecture, platform: $platform, digest: $digest, source_sha: $source_sha, version: $version}' \
            > "$receipt_dir/digest-receipt.json"

      - name: Upload AMD64 digest receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-digest-amd64
          path: ${{ runner.temp }}/ghcr-digest-amd64/digest-receipt.json
          if-no-files-found: error

  publish-ghcr-arm64:
    name: publish-ghcr (native-arm64)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [container-test]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # required to publish the release image to GHCR
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and publish native ARM64 image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.alpine
          target: runtime
          platforms: linux/arm64
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            XCSH_BUILD_COMMIT=${{ github.sha }}
            XCSH_BUILD_TAG=${{ github.ref_name }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Verify native ARM64 image and write digest receipt
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_MACHINE: aarch64
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$(docker run --rm --entrypoint uname "$IMAGE@$DIGEST" -m)" = "$EXPECTED_MACHINE"
          test "$(docker run --rm "$IMAGE@$DIGEST" --version)" = "xcsh/${GITHUB_REF_NAME#v}"
          receipt_dir="$RUNNER_TEMP/ghcr-digest-arm64"
          mkdir -p "$receipt_dir"
          jq -n \
            --arg architecture arm64 \
            --arg platform linux/arm64 \
            --arg digest "$DIGEST" \
            --arg source_sha "$GITHUB_SHA" \
            --arg version "$GITHUB_REF_NAME" \
            '{schema_version: 1, architecture: $architecture, platform: $platform, digest: $digest, source_sha: $source_sha, version: $version}' \
            > "$receipt_dir/digest-receipt.json"

      - name: Upload ARM64 digest receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-digest-arm64
          path: ${{ runner.temp }}/ghcr-digest-arm64/digest-receipt.json
          if-no-files-found: error

  publish-ghcr:
    name: publish-ghcr
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-ghcr-amd64, publish-ghcr-arm64]
    runs-on: xcsh-container-build
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # required to publish the release manifest to GHCR
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container
          name: xcsh-container-build-cache
          use: true
          cleanup: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Download architecture digest receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ghcr-digest-*
          path: ${{ runner.temp }}/ghcr-digests

      - name: Create semantic multi-platform manifest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          METADATA_JSON: ${{ steps.metadata.outputs.json }}
        run: |
          set -euo pipefail
          refs=()
          for architecture in amd64 arm64; do
            receipt="$RUNNER_TEMP/ghcr-digests/ghcr-digest-${architecture}/digest-receipt.json"
            jq -e \
              --arg architecture "$architecture" \
              --arg platform "linux/$architecture" \
              --arg source_sha "$GITHUB_SHA" \
              --arg version "$GITHUB_REF_NAME" \
              '.schema_version == 1 and .architecture == $architecture and .platform == $platform and .source_sha == $source_sha and .version == $version and (.digest | test("^sha256:[0-9a-f]{64}$"))' \
              "$receipt" >/dev/null
            refs+=("$IMAGE@$(jq -er '.digest' "$receipt")")
          done
          mapfile -t tags < <(jq -r '.tags[]' <<<"$METADATA_JSON")
          test "${#tags[@]}" -ge 2
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done
          docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"

      - name: Verify published multi-platform image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: |
          set -euo pipefail
          manifest=$(docker buildx imagetools inspect --raw "$IMAGE")
          platforms=$(jq -r \
            '[.manifests[] | select(.platform.os == "linux") | "\(.platform.os)/\(.platform.architecture)"] | sort | join(",")' \
            <<<"$manifest")
          if [ "$platforms" != "linux/amd64,linux/arm64" ]; then
            echo "Expected linux/amd64 and linux/arm64; found: $platforms" >&2
            exit 1
          fi

          index_digest="sha256:$(docker buildx imagetools inspect --raw "$IMAGE" | sha256sum | awk '{print $1}')"
          test -n "$index_digest"
