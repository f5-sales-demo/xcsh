---
name: Container

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  trust-gate:
    name: Verify same-repository trust boundary
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, xcsh, ubuntu-24.04]
    permissions: {}
    steps:
      - name: Confirm this runner has no Docker socket
        run: test ! -S /run/docker.sock

  container-build:
    name: container-build (native-amd64)
    needs: trust-gate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, xcsh, container-build]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: docker-container
          name: xcsh-container-build-cache
          use: true
          cleanup: false

      - name: Test native Alpine container
        run: |
          bash ./scripts/tdd-docker.sh

  podman-uat-harness:
    name: podman-uat-harness
    needs: trust-gate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, xcsh, container-build]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test ARM64 Podman UAT harness
        run: bash ./scripts/test-uat-podman-arm64.sh

  container-test:
    name: container-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: [trust-gate, container-build, podman-uat-harness]
    runs-on: [self-hosted, Linux, X64, xcsh, container-build]
    timeout-minutes: 5
    steps:
      - name: Require architecture and harness tests
        env:
          CONTAINER_BUILD_RESULT: ${{ needs.container-build.result }}
          PODMAN_HARNESS_RESULT: ${{ needs.podman-uat-harness.result }}
        run: |
          test "$CONTAINER_BUILD_RESULT" = success
          test "$PODMAN_HARNESS_RESULT" = success

  publish-ghcr:
    name: publish-ghcr
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [container-test]
    runs-on: [self-hosted, Linux, X64, xcsh, container-build]
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write # required to publish the release image to GHCR
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: docker-container
          name: xcsh-container-build-cache
          use: true
          cleanup: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.alpine
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            XCSH_BUILD_COMMIT=${{ github.sha }}
            XCSH_BUILD_TAG=${{ github.ref_name }}
          provenance: mode=max
          sbom: true

      - name: Verify published multi-platform image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: |
          set -euo pipefail
          manifest=$(docker buildx imagetools inspect --raw "$IMAGE")
          platforms=$(jq -r \
            '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort | join(",")' \
            <<<"$manifest")
          if [ "$platforms" != "amd64,arm64" ]; then
            echo "Expected linux/amd64 and linux/arm64; found: $platforms" >&2
            exit 1
          fi

          test "$(docker run --rm --platform linux/amd64 --entrypoint uname "$IMAGE" -m)" = "x86_64"
          docker run --rm --platform linux/amd64 "$IMAGE" --version
          test "$(docker run --rm --platform linux/arm64 --entrypoint uname "$IMAGE" -m)" = "aarch64"
          docker run --rm --platform linux/arm64 "$IMAGE" --version
