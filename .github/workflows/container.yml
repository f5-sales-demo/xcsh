---
name: Container

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  container-test:
    name: container-test
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Test Alpine container on amd64
        env:
          XCSH_EXPECTED_MACHINE: x86_64
          XCSH_TEST_PLATFORM: linux/amd64
        run: bash ./scripts/tdd-docker.sh

      - name: Test Alpine container on arm64
        env:
          XCSH_EXPECTED_MACHINE: aarch64
          XCSH_TEST_PLATFORM: linux/arm64
        run: bash ./scripts/tdd-docker.sh

  publish-ghcr:
    name: publish-ghcr
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [container-test]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.alpine
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            XCSH_BUILD_COMMIT=${{ github.sha }}
            XCSH_BUILD_TAG=${{ github.ref_name }}
          provenance: mode=max
          sbom: true

      - name: Verify published multi-platform image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: |
          set -euo pipefail
          manifest=$(docker buildx imagetools inspect --raw "$IMAGE")
          platforms=$(jq -r \
            '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort | join(",")' \
            <<<"$manifest")
          if [ "$platforms" != "amd64,arm64" ]; then
            echo "Expected linux/amd64 and linux/arm64; found: $platforms" >&2
            exit 1
          fi

          test "$(docker run --rm --platform linux/amd64 --entrypoint uname "$IMAGE" -m)" = "x86_64"
          docker run --rm --platform linux/amd64 "$IMAGE" --version
          test "$(docker run --rm --platform linux/arm64 --entrypoint uname "$IMAGE" -m)" = "aarch64"
          docker run --rm --platform linux/arm64 "$IMAGE" --version
