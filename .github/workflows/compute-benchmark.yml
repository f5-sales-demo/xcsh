---
name: Compute Runner Benchmark

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: compute-runner-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  socketless-install-benchmark:
    name: D8 socketless / scripts-${{ matrix.concurrent_scripts }} / ${{ matrix.cache }}
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'compute-benchmark-approved' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        concurrent_scripts: [4, 8, 16]
        cache: [cold, warm]
    runs-on: xcsh-socketless
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true

      - name: Verify baked Bun 1.3.14
        shell: bash
        run: test "$(command -v bun)" = /usr/local/bin/bun && test "$(bun --version)" = 1.3.14

      - name: Benchmark five identical installs
        env:
          CACHE_MODE: ${{ matrix.cache }}
          CONCURRENT_SCRIPTS: ${{ matrix.concurrent_scripts }}
        shell: bash
        run: |
          set -euo pipefail
          before=$(sha256sum package.json bun.lock)
          cache_dir="$RUNNER_TEMP/bun-cache"
          mkdir -p "$cache_dir"
          printf 'run\tseconds\tmax_rss_kib\n' > bun-install-benchmark.tsv
          for run in 1 2 3 4 5; do
            rm -rf node_modules
            if [[ "$CACHE_MODE" == cold ]]; then
              rm -rf "$cache_dir"
              mkdir -p "$cache_dir"
            fi
            /usr/bin/time -f '%e\t%M' -o "$RUNNER_TEMP/time.txt" \
              env BUN_INSTALL_CACHE_DIR="$cache_dir" bun install --frozen-lockfile \
                --concurrent-scripts "$CONCURRENT_SCRIPTS"
            printf '%s\t%s\n' "$run" "$(cat "$RUNNER_TEMP/time.txt")" >> bun-install-benchmark.tsv
            test "$(sha256sum package.json bun.lock)" = "$before"
          done
          total_kib=$(awk '/MemTotal:/ {print $2}' /proc/meminfo)
          awk -F '\t' -v total="$total_kib" 'NR > 1 { times[++n]=$2; if ($3 > max) max=$3 } END { for (i=1;i<=n;i++) for(j=i+1;j<=n;j++) if(times[i]>times[j]) {t=times[i];times[i]=times[j];times[j]=t}; printf "median_seconds=%s\npeak_memory_ratio=%.4f\n", times[3], max/total; if (max/total >= 0.8) exit 1 }' bun-install-benchmark.tsv | tee bun-install-summary.txt

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bun-install-xcsh-socketless-${{ matrix.concurrent_scripts }}-${{ matrix.cache }}
          path: |
            bun-install-benchmark.tsv
            bun-install-summary.txt
          if-no-files-found: error
  compute-install-benchmark:
    name: D16 compute / scripts-${{ matrix.concurrent_scripts }} / ${{ matrix.cache }}
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'compute-benchmark-approved' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        concurrent_scripts: [4, 8, 16]
        cache: [cold, warm]
    runs-on: xcsh-compute
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true

      - name: Verify baked Bun 1.3.14
        shell: bash
        run: test "$(command -v bun)" = /usr/local/bin/bun && test "$(bun --version)" = 1.3.14

      - name: Benchmark five identical installs
        env:
          CACHE_MODE: ${{ matrix.cache }}
          CONCURRENT_SCRIPTS: ${{ matrix.concurrent_scripts }}
        shell: bash
        run: |
          set -euo pipefail
          before=$(sha256sum package.json bun.lock)
          cache_dir="$RUNNER_TEMP/bun-cache"
          mkdir -p "$cache_dir"
          printf 'run\tseconds\tmax_rss_kib\n' > bun-install-benchmark.tsv
          for run in 1 2 3 4 5; do
            rm -rf node_modules
            if [[ "$CACHE_MODE" == cold ]]; then
              rm -rf "$cache_dir"
              mkdir -p "$cache_dir"
            fi
            /usr/bin/time -f '%e\t%M' -o "$RUNNER_TEMP/time.txt" \
              env BUN_INSTALL_CACHE_DIR="$cache_dir" bun install --frozen-lockfile \
                --concurrent-scripts "$CONCURRENT_SCRIPTS"
            printf '%s\t%s\n' "$run" "$(cat "$RUNNER_TEMP/time.txt")" >> bun-install-benchmark.tsv
            test "$(sha256sum package.json bun.lock)" = "$before"
          done
          total_kib=$(awk '/MemTotal:/ {print $2}' /proc/meminfo)
          awk -F '\t' -v total="$total_kib" 'NR > 1 { times[++n]=$2; if ($3 > max) max=$3 } END { for (i=1;i<=n;i++) for(j=i+1;j<=n;j++) if(times[i]>times[j]) {t=times[i];times[i]=times[j];times[j]=t}; printf "median_seconds=%s\npeak_memory_ratio=%.4f\n", times[3], max/total; if (max/total >= 0.8) exit 1 }' bun-install-benchmark.tsv | tee bun-install-summary.txt

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bun-install-xcsh-compute-${{ matrix.concurrent_scripts }}-${{ matrix.cache }}
          path: |
            bun-install-benchmark.tsv
            bun-install-summary.txt
          if-no-files-found: error
