---
name: Compute Runner Qualification

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: compute-runner-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-native-fixtures:
    name: Release native fixture (${{ matrix.platform }}, ${{ matrix.arch }}, ${{ matrix.variant }})
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'compute-benchmark-approved' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            variant: default
            variants: ""
          - os: windows-latest
            platform: win32
            arch: x64
            target: ""
            variant: baseline
            variants: baseline
          - os: windows-latest
            platform: win32
            arch: x64
            target: ""
            variant: modern
            variants: modern
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
          bun-version: "1.3.14"
      - uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}
      - name: Restore exact Rust cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Set up Zig 0.15.2
        uses: ./.github/actions/setup-zig
      - run: bash scripts/ci-bun-install.sh
      - name: Build release native fixture
        shell: bash
        env:
          CROSS_TARGET: ${{ matrix.target }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_VARIANTS: ${{ matrix.variants }}
        run: bun run ci:build:native
      - name: Upload immutable release native fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-native-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.variant }}
          path: packages/natives/native/pi_natives.${{ matrix.platform }}-${{ matrix.arch }}*.node
          if-no-files-found: error
          retention-days: 30

  d16-software-baseline:
    name: D16 / Bun 1.3.14 / software / ${{ matrix.cache }} / pair-${{ matrix.pair }}
    needs: release-native-fixtures
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'compute-benchmark-approved' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cache: [cold, warm]
        pair: [1, 2, 3, 4, 5]
    runs-on: xcsh-compute
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/runner-optimization-profile
        with:
          mode: full
          variant: baseline
          comparison: software
          cache-state: ${{ matrix.cache }}
          pair-id: ${{ matrix.pair }}

  d16-software-candidate:
    name: D16 / Bun 1.4.2 / software / ${{ matrix.cache }} / pair-${{ matrix.pair }}
    needs: d16-software-baseline
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'compute-benchmark-approved' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cache: [cold, warm]
        pair: [1, 2, 3, 4, 5]
    runs-on: xcsh-compute-bun-candidate
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/runner-optimization-profile
        with:
          mode: full
          variant: bun-1.4.2
          comparison: software
          cache-state: ${{ matrix.cache }}
          pair-id: ${{ matrix.pair }}

  d16-hardware-baseline:
    name: D16 / Bun 1.4.2 / hardware / ${{ matrix.cache }} / pair-${{ matrix.pair }}
    needs: d16-software-candidate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'compute-benchmark-approved' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cache: [cold, warm]
        pair: [1, 2, 3, 4, 5]
    runs-on: xcsh-compute-bun-candidate
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/runner-optimization-profile
        with:
          mode: full
          variant: baseline
          comparison: hardware
          cache-state: ${{ matrix.cache }}
          pair-id: ${{ matrix.pair }}

  f32-hardware-candidate:
    name: F32 / Bun 1.4.2 / hardware / ${{ matrix.cache }} / pair-${{ matrix.pair }}
    needs: d16-hardware-baseline
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'compute-benchmark-approved' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cache: [cold, warm]
        pair: [1, 2, 3, 4, 5]
    runs-on: xcsh-compute-f32-candidate
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/runner-optimization-profile
        with:
          mode: full
          variant: f32
          comparison: hardware
          cache-state: ${{ matrix.cache }}
          pair-id: ${{ matrix.pair }}

  d16-current-burst:
    name: Current D16 two-slot burst / slot-${{ matrix.slot }}
    needs: f32-hardware-candidate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'compute-benchmark-approved' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: xcsh-compute
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/runner-optimization-profile
        with:
          mode: pr
          variant: baseline
          comparison: burst
          cache-state: cold
          pair-id: slot-${{ matrix.slot }}

  d16-burst:
    name: Candidate D16 four-slot burst / slot-${{ matrix.slot }}
    needs: d16-current-burst
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'compute-benchmark-approved' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: xcsh-compute-bun-candidate
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/runner-optimization-profile
        with:
          mode: pr
          variant: d16-four
          comparison: burst
          cache-state: cold
          pair-id: slot-${{ matrix.slot }}

  f32-burst:
    name: F32 four-job burst / slot-${{ matrix.slot }}
    needs: d16-burst
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'compute-benchmark-approved' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: xcsh-compute-f32-candidate
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/runner-optimization-profile
        with:
          mode: pr
          variant: f32
          comparison: burst
          cache-state: cold
          pair-id: slot-${{ matrix.slot }}
