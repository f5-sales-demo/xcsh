---
name: Compute Runner Qualification

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: compute-runner-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  d16-software-baseline:
    name: D16 / Bun 1.3.14 / software / ${{ matrix.cache }} / pair-${{ matrix.pair }}
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'compute-benchmark-approved' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cache: [cold, warm]
        pair: [1, 2, 3, 4, 5]
    runs-on: xcsh-compute
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/runner-optimization-profile
        with:
          mode: full
          variant: baseline
          comparison: software
          cache-state: ${{ matrix.cache }}
          pair-id: ${{ matrix.pair }}

  d16-software-candidate:
    name: D16 / Bun 1.4.2 / software / ${{ matrix.cache }} / pair-${{ matrix.pair }}
    needs: d16-software-baseline
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'compute-benchmark-approved' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cache: [cold, warm]
        pair: [1, 2, 3, 4, 5]
    runs-on: xcsh-compute-bun-candidate
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/runner-optimization-profile
        with:
          mode: full
          variant: bun-1.4.2
          comparison: software
          cache-state: ${{ matrix.cache }}
          pair-id: ${{ matrix.pair }}

  d16-hardware-baseline:
    name: D16 / Bun 1.4.2 / hardware / ${{ matrix.cache }} / pair-${{ matrix.pair }}
    needs: d16-software-candidate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'compute-benchmark-approved' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cache: [cold, warm]
        pair: [1, 2, 3, 4, 5]
    runs-on: xcsh-compute-bun-candidate
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/runner-optimization-profile
        with:
          mode: full
          variant: baseline
          comparison: hardware
          cache-state: ${{ matrix.cache }}
          pair-id: ${{ matrix.pair }}

  f32-hardware-candidate:
    name: F32 / Bun 1.4.2 / hardware / ${{ matrix.cache }} / pair-${{ matrix.pair }}
    needs: d16-hardware-baseline
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'compute-benchmark-approved' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cache: [cold, warm]
        pair: [1, 2, 3, 4, 5]
    runs-on: xcsh-compute-f32-candidate
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/runner-optimization-profile
        with:
          mode: full
          variant: f32
          comparison: hardware
          cache-state: ${{ matrix.cache }}
          pair-id: ${{ matrix.pair }}

  d16-current-burst:
    name: Current D16 two-slot burst / slot-${{ matrix.slot }}
    needs: f32-hardware-candidate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'compute-benchmark-approved' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: xcsh-compute
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/runner-optimization-profile
        with:
          mode: pr
          variant: baseline
          comparison: burst
          cache-state: cold
          pair-id: slot-${{ matrix.slot }}

  d16-burst:
    name: Candidate D16 four-slot burst / slot-${{ matrix.slot }}
    needs: d16-current-burst
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'compute-benchmark-approved' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: xcsh-compute-bun-candidate
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/runner-optimization-profile
        with:
          mode: pr
          variant: d16-four
          comparison: burst
          cache-state: cold
          pair-id: slot-${{ matrix.slot }}

  f32-burst:
    name: F32 four-job burst / slot-${{ matrix.slot }}
    needs: d16-burst
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'compute-benchmark-approved' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: xcsh-compute-f32-candidate
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/runner-optimization-profile
        with:
          mode: pr
          variant: f32
          comparison: burst
          cache-state: cold
          pair-id: slot-${{ matrix.slot }}
