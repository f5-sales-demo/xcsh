---
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_npm:
        description: "Skip npm publish"
        type: boolean
        default: false

# Read-only default; the three jobs that write already declare their own scopes
# (auto-release, create-release, publish-npm). Everything else either only builds
# and tests, or authenticates with RELEASE_TOKEN rather than GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never auto-cancel a tag run. The publishing chain (build-release ->
  # create-release -> publish-npm / update-homebrew -> install verification) lives in this workflow and
  # inherits this group, so a cancel between publish-npm and update-homebrew
  # would leave the version on npm with Homebrew stale and no rollback. All six
  # jobs were cancelled on the v19.96.0 run; that escaped harm only because the
  # cancel arrived before publish-npm did any work.
  #
  # refs/tags/vX.Y.Z is unique per tag, so an ordinary push cannot supersede it --
  # the realistic collision is ci-ensure-tag-release-run.ts dispatching the chain
  # after ~120s of polling, racing a run that only just became visible.
  #
  # main and PR branches keep cancelling: those collisions are frequent but cost
  # only latency, and a superseded auto-release is picked up by the next run.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Fast lint + type check (no Rust, no native build needed)
  check:
    name: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Bun 1.3
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        id: setup-bun
        continue-on-error: true
        with:
          bun-version: "1.3"
      - name: Retry Bun setup on failure
        if: steps.setup-bun.outcome == 'failure'
        shell: bash
        run: |
          BUN_VERSION=$(curl -sSf "https://api.github.com/repos/oven-sh/bun/releases" \
            -H "Accept: application/vnd.github+json" \
            | grep -o '"tag_name": "bun-v1\.3\.[0-9]*"' \
            | head -1 \
            | grep -o '1\.3\.[0-9]*') || true
          if [ -z "$BUN_VERSION" ]; then
            echo "::warning::Could not resolve latest 1.3.x, falling back to 1.3.13"
            BUN_VERSION=1.3.13
          fi
          echo "Resolved Bun version: $BUN_VERSION"
          case "$RUNNER_OS" in
            Linux)  PLATFORM="linux-x64" ;;
            macOS)
              case "$RUNNER_ARCH" in
                ARM64) PLATFORM="darwin-aarch64" ;;
                *)     PLATFORM="darwin-x64" ;;
              esac ;;
            Windows) PLATFORM="windows-x64" ;;
          esac
          URL="https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-${PLATFORM}.zip"
          OUTFILE="bun-download.zip"
          echo "::warning::setup-bun action failed, retrying manual download from $URL"
          MAX_RETRIES=3
          DELAY=15
          for attempt in $(seq 1 $MAX_RETRIES); do
            if curl -sSfL --connect-timeout 15 --max-time 120 "$URL" -o "$OUTFILE"; then
              break
            fi
            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              echo "::error::Failed to download Bun after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Download attempt $attempt/$MAX_RETRIES failed, retrying in ${DELAY}s..."
            sleep $DELAY
            DELAY=$((DELAY * 2))
          done
          unzip -q "$OUTFILE"
          rm -f "$OUTFILE"
          BUN_DIR="$PWD/bun-${PLATFORM}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BUN_DIR=$(cygpath -w "$BUN_DIR")
          fi
          echo "$BUN_DIR" >> "$GITHUB_PATH"
          bun --version
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Type check workspace
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run ci:check:full

  setup-zig:
    name: Verify Zig (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Zig 0.15.2
        uses: ./.github/actions/setup-zig
      - name: Verify Zig
        shell: bash
        run: zig version

  native:
    name: Native build (${{ matrix.os }}, ${{ matrix.arch }})
    needs: setup-zig
    strategy:
      fail-fast: false
      matrix:
        include: ${{ startsWith(github.ref, 'refs/tags/v') && fromJSON('[
          {"os":"ubuntu-22.04","platform":"linux","arch":"x64","variants":"baseline","rust_checks":true,"sandbox_check":true},
          {"os":"ubuntu-22.04","platform":"linux","arch":"x64","variants":"modern"},
          {"os":"ubuntu-22.04","platform":"linux","arch":"arm64","target":"aarch64-unknown-linux-gnu"},
          {"os":"macos-15-intel","platform":"darwin","arch":"x64","variants":"baseline"},
          {"os":"macos-15-intel","platform":"darwin","arch":"x64","variants":"modern"},
          {"os":"macos-14","platform":"darwin","arch":"arm64","sandbox_check":true},
          {"os":"windows-latest","platform":"win32","arch":"x64","variants":"baseline"},
          {"os":"windows-latest","platform":"win32","arch":"x64","variants":"modern"}
          ]') || fromJSON('[
          {"os":"ubuntu-22.04","platform":"linux","arch":"x64","variants":"baseline","rust_checks":true,"sandbox_check":true},
          {"os":"ubuntu-22.04","platform":"linux","arch":"x64","variants":"modern"},
          {"os":"macos-14","platform":"darwin","arch":"arm64","sandbox_check":true}
          ]') }}
    runs-on: ${{ matrix.os }}
    env:
      RUST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: ${{ matrix.target }}${{ matrix.variants }}
          cache-workspace-crates: true
      - name: Setup Bun 1.3
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        id: setup-bun
        continue-on-error: true
        with:
          bun-version: "1.3"
      - name: Retry Bun setup on failure
        if: steps.setup-bun.outcome == 'failure'
        shell: bash
        run: |
          BUN_VERSION=$(curl -sSf "https://api.github.com/repos/oven-sh/bun/releases" \
            -H "Accept: application/vnd.github+json" \
            | grep -o '"tag_name": "bun-v1\.3\.[0-9]*"' \
            | head -1 \
            | grep -o '1\.3\.[0-9]*') || true
          if [ -z "$BUN_VERSION" ]; then
            echo "::warning::Could not resolve latest 1.3.x, falling back to 1.3.13"
            BUN_VERSION=1.3.13
          fi
          echo "Resolved Bun version: $BUN_VERSION"
          case "$RUNNER_OS" in
            Linux)  PLATFORM="linux-x64" ;;
            macOS)
              case "$RUNNER_ARCH" in
                ARM64) PLATFORM="darwin-aarch64" ;;
                *)     PLATFORM="darwin-x64" ;;
              esac ;;
            Windows) PLATFORM="windows-x64" ;;
          esac
          URL="https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-${PLATFORM}.zip"
          OUTFILE="bun-download.zip"
          echo "::warning::setup-bun action failed, retrying manual download from $URL"
          MAX_RETRIES=3
          DELAY=15
          for attempt in $(seq 1 $MAX_RETRIES); do
            if curl -sSfL --connect-timeout 15 --max-time 120 "$URL" -o "$OUTFILE"; then
              break
            fi
            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              echo "::error::Failed to download Bun after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Download attempt $attempt/$MAX_RETRIES failed, retrying in ${DELAY}s..."
            sleep $DELAY
            DELAY=$((DELAY * 2))
          done
          unzip -q "$OUTFILE"
          rm -f "$OUTFILE"
          BUN_DIR="$PWD/bun-${PLATFORM}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BUN_DIR=$(cygpath -w "$BUN_DIR")
          fi
          echo "$BUN_DIR" >> "$GITHUB_PATH"
          bun --version
      - name: Setup Zig 0.15.2
        uses: ./.github/actions/setup-zig
      - run: bun install --frozen-lockfile
      - name: Install cross-compilation toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Rust checks
        if: matrix.rust_checks
        run: bun run check:rs
      # The containment fence's Landlock compiler. `crates/brush-core-vendored` is excluded from the
      # workspace so `cargo test -p brush-core` refuses to run; this crate is a member and reaches that
      # code by path, so it is the only place the compiler is covered. Pure logic — no kernel needed.
      - name: Containment fence tests
        if: matrix.rust_checks
        run: cargo test -p containment-check
      # Real enforcement, asserted — not a print and not a skip.
      #
      # This started as a diagnostic because I did not know whether this runner had Landlock in its LSM
      # list (Ubuntu only added it to the default list in 24.04). It reported
      # `lockdown,capability,landlock,yama,apparmor` on kernel 6.8-azure, so the answer is yes and the leg
      # can assert. Worth having measured rather than guessed: I expected the opposite.
      #
      # `status` exits non-zero when there is no backend, which is deliberate. If this runner image ever
      # loses Landlock, this step must fail loudly rather than quietly stop testing the boundary — a
      # security check that skips reads exactly like one that passed.
      - name: Landlock enforcement
        if: matrix.rust_checks
        run: |
          echo "LSM list: $(cat /sys/kernel/security/lsm 2>/dev/null || echo unavailable)"
          echo "kernel: $(uname -r)"
          cargo build -p containment-check
          cargo run -q -p containment-check -- status
          bash crates/containment-check/landlock-e2e.sh target/debug/containment-check
      - name: Build native addon(s)
        env:
          CROSS_TARGET: ${{ matrix.target }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_VARIANTS: ${{ matrix.variants }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        shell: bash
        run: |
          bun run ci:build:native
      # Run the diagnostic from inside the same fenced BashTool profile operators use. The standalone
      # install smoke did not reproduce nested Seatbelt/Landlock composition, which is how #2800
      # shipped 10/10 in CI and reported 7/10 in a healthy session.
      - name: Sandbox self-test inside live bash profile
        if: matrix.sandbox_check
        run: bun test packages/coding-agent/test/sandbox-check.test.ts
      - name: Upload native addon(s)
        uses: actions/upload-artifact@v7
        with:
          name: pi-natives-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.variants && format('-{0}', matrix.variants) || '' }}
          path: packages/natives/native/pi_natives.${{ matrix.platform }}-${{ matrix.arch }}*.node
          if-no-files-found: error

  test:
    name: test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
      - name: Setup Bun 1.3
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        id: setup-bun
        continue-on-error: true
        with:
          bun-version: "1.3"
      - name: Retry Bun setup on failure
        if: steps.setup-bun.outcome == 'failure'
        shell: bash
        run: |
          BUN_VERSION=$(curl -sSf "https://api.github.com/repos/oven-sh/bun/releases" \
            -H "Accept: application/vnd.github+json" \
            | grep -o '"tag_name": "bun-v1\.3\.[0-9]*"' \
            | head -1 \
            | grep -o '1\.3\.[0-9]*') || true
          if [ -z "$BUN_VERSION" ]; then
            echo "::warning::Could not resolve latest 1.3.x, falling back to 1.3.13"
            BUN_VERSION=1.3.13
          fi
          echo "Resolved Bun version: $BUN_VERSION"
          case "$RUNNER_OS" in
            Linux)  PLATFORM="linux-x64" ;;
            macOS)
              case "$RUNNER_ARCH" in
                ARM64) PLATFORM="darwin-aarch64" ;;
                *)     PLATFORM="darwin-x64" ;;
              esac ;;
            Windows) PLATFORM="windows-x64" ;;
          esac
          URL="https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-${PLATFORM}.zip"
          OUTFILE="bun-download.zip"
          echo "::warning::setup-bun action failed, retrying manual download from $URL"
          MAX_RETRIES=3
          DELAY=15
          for attempt in $(seq 1 $MAX_RETRIES); do
            if curl -sSfL --connect-timeout 15 --max-time 120 "$URL" -o "$OUTFILE"; then
              break
            fi
            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              echo "::error::Failed to download Bun after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Download attempt $attempt/$MAX_RETRIES failed, retrying in ${DELAY}s..."
            sleep $DELAY
            DELAY=$((DELAY * 2))
          done
          unzip -q "$OUTFILE"
          rm -f "$OUTFILE"
          BUN_DIR="$PWD/bun-${PLATFORM}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BUN_DIR=$(cygpath -w "$BUN_DIR")
          fi
          echo "$BUN_DIR" >> "$GITHUB_PATH"
          bun --version
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          cache-workspace-crates: true
      - name: Setup Zig 0.15.2
        uses: ./.github/actions/setup-zig
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: nextest
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep imagemagick
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd
          sudo ln -sf /usr/bin/convert /usr/local/bin/magick
      # Ensure bun is on a PATH that child processes (posix_spawn, native shell
      # addon) always inherit — setup-bun adds to $GITHUB_PATH which steps see,
      # but spawned subprocesses may not. /usr/local/bin is always on PATH.
      - name: Copy bun to /usr/local/bin so subprocesses always find it
        run: |
          sudo cp "$(which bun)" /usr/local/bin/bun
          sudo chmod +x /usr/local/bin/bun
          /usr/local/bin/bun --version
      - run: bun install --frozen-lockfile
      - run: bun run build:native
      - name: Verify bun binary exists before tests
        run: |
          echo "which bun: $(which bun)"
          echo "file type: $(file /usr/local/bin/bun)"
          echo "ls -la: $(ls -la /usr/local/bin/bun)"
          echo "bun.path.ts resolves to: $(bun -e "const{existsSync}=require('fs');console.log(existsSync('/usr/local/bin/bun')?'/usr/local/bin/bun':'fallback')")"
          /usr/local/bin/bun --version
      - name: Test workspace
        run: bun run ci:test:full
      - name: CLI smoke test
        run: bun run ci:test:smoke

  install_methods:
    name: Test installation methods
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Setup Bun 1.3
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        id: setup-bun
        continue-on-error: true
        with:
          bun-version: "1.3"
      - name: Retry Bun setup on failure
        if: steps.setup-bun.outcome == 'failure'
        shell: bash
        run: |
          BUN_VERSION=$(curl -sSf "https://api.github.com/repos/oven-sh/bun/releases" \
            -H "Accept: application/vnd.github+json" \
            | grep -o '"tag_name": "bun-v1\.3\.[0-9]*"' \
            | head -1 \
            | grep -o '1\.3\.[0-9]*') || true
          if [ -z "$BUN_VERSION" ]; then
            echo "::warning::Could not resolve latest 1.3.x, falling back to 1.3.13"
            BUN_VERSION=1.3.13
          fi
          echo "Resolved Bun version: $BUN_VERSION"
          case "$RUNNER_OS" in
            Linux)  PLATFORM="linux-x64" ;;
            macOS)
              case "$RUNNER_ARCH" in
                ARM64) PLATFORM="darwin-aarch64" ;;
                *)     PLATFORM="darwin-x64" ;;
              esac ;;
            Windows) PLATFORM="windows-x64" ;;
          esac
          URL="https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-${PLATFORM}.zip"
          OUTFILE="bun-download.zip"
          echo "::warning::setup-bun action failed, retrying manual download from $URL"
          MAX_RETRIES=3
          DELAY=15
          for attempt in $(seq 1 $MAX_RETRIES); do
            if curl -sSfL --connect-timeout 15 --max-time 120 "$URL" -o "$OUTFILE"; then
              break
            fi
            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              echo "::error::Failed to download Bun after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Download attempt $attempt/$MAX_RETRIES failed, retrying in ${DELAY}s..."
            sleep $DELAY
            DELAY=$((DELAY * 2))
          done
          unzip -q "$OUTFILE"
          rm -f "$OUTFILE"
          BUN_DIR="$PWD/bun-${PLATFORM}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BUN_DIR=$(cygpath -w "$BUN_DIR")
          fi
          echo "$BUN_DIR" >> "$GITHUB_PATH"
          bun --version
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          cache-workspace-crates: true
      - name: Setup Zig 0.15.2
        uses: ./.github/actions/setup-zig
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep imagemagick
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd
          sudo ln -sf /usr/bin/convert /usr/local/bin/magick
      - run: bun install --frozen-lockfile
      - name: Install method smoke tests
        run: bun run ci:test:install-methods

  # Invalidate already-green release PRs immediately when their recorded base
  # falls behind main. Release creation remains in auto-release after full CI.
  invalidate-stale-release-prs:
    name: Invalidate stale release pull requests
    if: github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore:')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Setup Bun 1.3
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"
      - name: Close release PRs based on stale main
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: bun scripts/release.ts invalidate-stale

  auto-release:
    name: Prepare automatic release
    if: github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore:')
    needs: [check, native, test, install_methods]
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0
      - name: Setup Bun 1.3
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        id: setup-bun
        continue-on-error: true
        with:
          bun-version: "1.3"
      - name: Retry Bun setup on failure
        if: steps.setup-bun.outcome == 'failure'
        shell: bash
        run: |
          BUN_VERSION=$(curl -sSf "https://api.github.com/repos/oven-sh/bun/releases" \
            -H "Accept: application/vnd.github+json" \
            | grep -o '"tag_name": "bun-v1\.3\.[0-9]*"' \
            | head -1 \
            | grep -o '1\.3\.[0-9]*') || true
          if [ -z "$BUN_VERSION" ]; then
            echo "::warning::Could not resolve latest 1.3.x, falling back to 1.3.13"
            BUN_VERSION=1.3.13
          fi
          echo "Resolved Bun version: $BUN_VERSION"
          case "$RUNNER_OS" in
            Linux)  PLATFORM="linux-x64" ;;
            macOS)
              case "$RUNNER_ARCH" in
                ARM64) PLATFORM="darwin-aarch64" ;;
                *)     PLATFORM="darwin-x64" ;;
              esac ;;
            Windows) PLATFORM="windows-x64" ;;
          esac
          URL="https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-${PLATFORM}.zip"
          OUTFILE="bun-download.zip"
          echo "::warning::setup-bun action failed, retrying manual download from $URL"
          MAX_RETRIES=3
          DELAY=15
          for attempt in $(seq 1 $MAX_RETRIES); do
            if curl -sSfL --connect-timeout 15 --max-time 120 "$URL" -o "$OUTFILE"; then
              break
            fi
            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              echo "::error::Failed to download Bun after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Download attempt $attempt/$MAX_RETRIES failed, retrying in ${DELAY}s..."
            sleep $DELAY
            DELAY=$((DELAY * 2))
          done
          unzip -q "$OUTFILE"
          rm -f "$OUTFILE"
          BUN_DIR="$PWD/bun-${PLATFORM}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BUN_DIR=$(cygpath -w "$BUN_DIR")
          fi
          echo "$BUN_DIR" >> "$GITHUB_PATH"
          bun --version
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Auto-detect version and release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: bun scripts/release.ts auto

  # Build Linux + Windows binaries on Ubuntu
  build-release:
    name: Build Linux and Windows release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, native, test, install_methods]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          lfs: true
      - name: Setup Bun 1.3
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        id: setup-bun
        continue-on-error: true
        with:
          bun-version: "1.3"
      - name: Retry Bun setup on failure
        if: steps.setup-bun.outcome == 'failure'
        shell: bash
        run: |
          BUN_VERSION=$(curl -sSf "https://api.github.com/repos/oven-sh/bun/releases" \
            -H "Accept: application/vnd.github+json" \
            | grep -o '"tag_name": "bun-v1\.3\.[0-9]*"' \
            | head -1 \
            | grep -o '1\.3\.[0-9]*') || true
          if [ -z "$BUN_VERSION" ]; then
            echo "::warning::Could not resolve latest 1.3.x, falling back to 1.3.13"
            BUN_VERSION=1.3.13
          fi
          echo "Resolved Bun version: $BUN_VERSION"
          case "$RUNNER_OS" in
            Linux)  PLATFORM="linux-x64" ;;
            macOS)
              case "$RUNNER_ARCH" in
                ARM64) PLATFORM="darwin-aarch64" ;;
                *)     PLATFORM="darwin-x64" ;;
              esac ;;
            Windows) PLATFORM="windows-x64" ;;
          esac
          URL="https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-${PLATFORM}.zip"
          OUTFILE="bun-download.zip"
          echo "::warning::setup-bun action failed, retrying manual download from $URL"
          MAX_RETRIES=3
          DELAY=15
          for attempt in $(seq 1 $MAX_RETRIES); do
            if curl -sSfL --connect-timeout 15 --max-time 120 "$URL" -o "$OUTFILE"; then
              break
            fi
            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              echo "::error::Failed to download Bun after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Download attempt $attempt/$MAX_RETRIES failed, retrying in ${DELAY}s..."
            sleep $DELAY
            DELAY=$((DELAY * 2))
          done
          unzip -q "$OUTFILE"
          rm -f "$OUTFILE"
          BUN_DIR="$PWD/bun-${PLATFORM}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BUN_DIR=$(cygpath -w "$BUN_DIR")
          fi
          echo "$BUN_DIR" >> "$GITHUB_PATH"
          bun --version
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Download native addons
        uses: actions/download-artifact@v8
        with:
          pattern: pi-natives-*
          path: packages/natives/native
          merge-multiple: true
      - name: Verify native addons
        run: bun run ci:release:verify-natives
      - name: Build Linux and Windows binaries
        env:
          XCSH_BUILD_BRANCH: main # compiled binaries have no .git at runtime; pin branch at build time
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: bun scripts/ci-release-build-binaries.ts --platform linux,win32
      - name: Verify compiled Linux sandbox check in a direct-home live profile
        env:
          XCSH_TEST_SANDBOX_CHECK_BINARY: ${{ github.workspace }}/packages/coding-agent/binaries/xcsh-linux-x64
        run: bun test packages/coding-agent/test/sandbox-check.test.ts
      - name: Stage native addons for release
        run: cp packages/natives/native/*.node packages/coding-agent/binaries/
      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries-linux-win
          path: packages/coding-agent/binaries/*
          if-no-files-found: error

  # Build macOS binaries natively on matching architecture, then sign and notarize
  build-sign-macos:
    name: Build and sign macOS (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, native, test, install_methods]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          lfs: true
      - name: Setup Bun 1.3
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        id: setup-bun
        continue-on-error: true
        with:
          bun-version: "1.3"
      - name: Retry Bun setup on failure
        if: steps.setup-bun.outcome == 'failure'
        shell: bash
        run: |
          BUN_VERSION=$(curl -sSf "https://api.github.com/repos/oven-sh/bun/releases" \
            -H "Accept: application/vnd.github+json" \
            | grep -o '"tag_name": "bun-v1\.3\.[0-9]*"' \
            | head -1 \
            | grep -o '1\.3\.[0-9]*') || true
          if [ -z "$BUN_VERSION" ]; then
            echo "::warning::Could not resolve latest 1.3.x, falling back to 1.3.13"
            BUN_VERSION=1.3.13
          fi
          echo "Resolved Bun version: $BUN_VERSION"
          case "$RUNNER_OS" in
            Linux)  PLATFORM="linux-x64" ;;
            macOS)
              case "$RUNNER_ARCH" in
                ARM64) PLATFORM="darwin-aarch64" ;;
                *)     PLATFORM="darwin-x64" ;;
              esac ;;
            Windows) PLATFORM="windows-x64" ;;
          esac
          URL="https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-${PLATFORM}.zip"
          OUTFILE="bun-download.zip"
          echo "::warning::setup-bun action failed, retrying manual download from $URL"
          MAX_RETRIES=3
          DELAY=15
          for attempt in $(seq 1 $MAX_RETRIES); do
            if curl -sSfL --connect-timeout 15 --max-time 120 "$URL" -o "$OUTFILE"; then
              break
            fi
            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              echo "::error::Failed to download Bun after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Download attempt $attempt/$MAX_RETRIES failed, retrying in ${DELAY}s..."
            sleep $DELAY
            DELAY=$((DELAY * 2))
          done
          unzip -q "$OUTFILE"
          rm -f "$OUTFILE"
          BUN_DIR="$PWD/bun-${PLATFORM}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BUN_DIR=$(cygpath -w "$BUN_DIR")
          fi
          echo "$BUN_DIR" >> "$GITHUB_PATH"
          bun --version
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('**/bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Download macOS native addons
        uses: actions/download-artifact@v8
        with:
          pattern: pi-natives-darwin-${{ matrix.arch }}*
          path: packages/natives/native
          merge-multiple: true
      # Sign + notarize the native addon BEFORE it is embedded into the compiled
      # binary. xcsh extracts the embedded .node to ~/.xcsh/natives/<ver>/ at
      # runtime; that extracted copy is a byte-for-byte image of what we embed, so
      # it only carries a notarized signature if the embedded .node was signed +
      # notarized here. Without this, managed/MDM Macs block the dlopen with
      # "pi_natives… could not verify it is free of malware".
      - name: Import Code Signing Certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          openssl pkcs12 -info -in "$RUNNER_TEMP/certificate.p12" -noout -passin pass:"$APPLE_CERTIFICATE_PASSWORD" || {
            echo "ERROR: Invalid p12 file or wrong password"
            exit 1
          }

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Sign and notarize native addons
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "::error::No Developer ID signing identity found for native addons"
            exit 1
          fi
          shopt -s nullglob
          NODES=(packages/natives/native/*.node)
          if [ ${#NODES[@]} -eq 0 ]; then
            echo "::error::No native (.node) addons found to sign in packages/natives/native"
            exit 1
          fi
          echo "Signing ${#NODES[@]} native addon(s) with: $SIGNING_IDENTITY"
          for node in "${NODES[@]}"; do
            # Strip any prior ad-hoc/linker signature, then Dev-ID sign with hardened runtime.
            codesign --remove-signature "$node" 2>/dev/null || true
            ATTEMPT=1
            until codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$node" 2>&1; do
              if [ "$ATTEMPT" -ge 5 ]; then echo "::error::codesign failed for $node"; exit 1; fi
              echo "::warning::codesign $node attempt $ATTEMPT failed, retrying..."; sleep $((ATTEMPT * 5)); ATTEMPT=$((ATTEMPT + 1))
            done
            codesign --verify --verbose "$node"
            codesign -dvvv "$node" 2>&1 | grep -E "Authority=Developer ID Application|flags=" || true
          done
          # Notarize the addon(s). A bare .node cannot be stapled, so the load relies
          # on Gatekeeper's online notarization check (cdhash registered with Apple).
          ZIP="$RUNNER_TEMP/natives-${RELEASE_ARCH}.zip"
          ditto -c -k packages/natives/native "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      # Hard gate: the sign step's own checks are soft (grep ... || true, and
      # notarytool --wait does not fail on an Invalid result), so verify the addons
      # are ACTUALLY Developer-ID signed + hardened-runtime + notarized before they
      # are embedded. Without this a release could silently ship an ad-hoc/unnotarized
      # .node that dies at dlopen on managed/MDM Macs ("could not verify... malware").
      - name: Verify native addons are signed + notarized
        run: bun run ci:release:verify-native-signing

      - name: Build macOS binary
        env:
          XCSH_BUILD_BRANCH: main # compiled binaries have no .git at runtime; pin branch at build time
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: bun scripts/ci-release-build-binaries.ts --platform darwin --arch "$RELEASE_ARCH"
      - name: Stage macOS native addons for release
        run: cp packages/natives/native/*.node packages/coding-agent/binaries/

      # Cert already imported above (before the build, so the native addon could be
      # signed + notarized prior to embedding). Reuse that keychain here.
      - name: Sign macOS Binary
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "ERROR: No Developer ID signing identity found"
            exit 1
          fi
          echo "Using signing identity: $SIGNING_IDENTITY"

          BINARY_PATH="packages/coding-agent/binaries/xcsh-darwin-${RELEASE_ARCH}"
          if [ -f "$BINARY_PATH" ]; then
            echo "=== Binary diagnostics ==="
            file "$BINARY_PATH"
            ls -la "$BINARY_PATH"
            echo "Mach-O architectures:"
            lipo -info "$BINARY_PATH" 2>&1 || true
            echo "Existing signature state:"
            codesign -dvvv "$BINARY_PATH" 2>&1 || true
            echo "==========================="

            # Strip any existing (possibly malformed) signature from Bun-compiled binary
            # Bun's --compile can produce binaries with signature blocks that codesign --force
            # cannot replace — removing first ensures a clean slate
            echo "Stripping existing signature..."
            codesign --remove-signature "$BINARY_PATH" 2>&1 || true
            echo "After strip:"
            codesign -dvvv "$BINARY_PATH" 2>&1 || true

            # Apple's timestamp server can be transiently unavailable — retry with exponential backoff
            CODESIGN_MAX_ATTEMPTS=5
            CODESIGN_DELAY=5
            for attempt in $(seq 1 "$CODESIGN_MAX_ATTEMPTS"); do
              echo "codesign attempt $attempt/$CODESIGN_MAX_ATTEMPTS..."
              if codesign --force --options runtime \
                --entitlements scripts/entitlements.plist \
                --sign "$SIGNING_IDENTITY" \
                --timestamp "$BINARY_PATH" 2>&1; then
                echo "codesign succeeded on attempt $attempt"
                break
              fi
              if [ "$attempt" -eq "$CODESIGN_MAX_ATTEMPTS" ]; then
                echo "::error::codesign failed after $CODESIGN_MAX_ATTEMPTS attempts"
                exit 1
              fi
              echo "::warning::codesign attempt $attempt failed, retrying in ${CODESIGN_DELAY}s..."
              sleep "$CODESIGN_DELAY"
              CODESIGN_DELAY=$((CODESIGN_DELAY * 2))
            done

            codesign --verify --verbose "$BINARY_PATH" || {
              echo "::error::Code signature verification failed for ${RELEASE_ARCH}"
              exit 1
            }

            AUTHORITY=$(codesign -dvvv "$BINARY_PATH" 2>&1 | grep "Authority=Developer ID Application" || true)
            if [ -z "$AUTHORITY" ]; then
              echo "::error::Binary not signed with Developer ID Application certificate"
              exit 1
            fi
            echo "  Signed with: $AUTHORITY"

            FLAGS=$(codesign -dvvv "$BINARY_PATH" 2>&1 | grep "flags=" || true)
            if echo "$FLAGS" | grep -q "runtime"; then
              echo "  Hardened runtime enabled"
            else
              echo "::error::Hardened runtime not enabled"
              exit 1
            fi

            echo "${RELEASE_ARCH} signed successfully"
          else
            echo "::error::Binary not found: $BINARY_PATH"
            exit 1
          fi

      - name: Notarize macOS Binary
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          BINARY_PATH="packages/coding-agent/binaries/xcsh-darwin-${RELEASE_ARCH}"
          ZIP_PATH="$RUNNER_TEMP/xcsh-darwin-${RELEASE_ARCH}.zip"

          ditto -c -k --keepParent "$BINARY_PATH" "$ZIP_PATH"

          echo "Submitting ${RELEASE_ARCH} for notarization..."
          echo "Xcode version: $(xcode-select -p)"
          xcrun notarytool --version 2>&1 || true

          MAX_ATTEMPTS=3
          BACKOFF=30
          ATTEMPT=0
          NOTARIZE_OK=false

          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Notarization attempt $ATTEMPT/$MAX_ATTEMPTS..."
            NOTARY_EXIT=0
            NOTARY_OUTPUT=$(xcrun notarytool submit "$ZIP_PATH" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait --verbose 2>&1) || NOTARY_EXIT=$?
            echo "$NOTARY_OUTPUT"

            if echo "$NOTARY_OUTPUT" | grep -q "status: Accepted"; then
              echo "  Notarization accepted for ${RELEASE_ARCH} on attempt $ATTEMPT"
              NOTARIZE_OK=true
              break
            fi

            echo "::warning::Notarization attempt $ATTEMPT failed (exit $NOTARY_EXIT)"
            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "  Retrying in ${BACKOFF}s..."
              sleep "$BACKOFF"
              BACKOFF=$((BACKOFF * 2))
            fi
          done

          if [ "$NOTARIZE_OK" != "true" ]; then
            echo "::error::Notarization failed for ${RELEASE_ARCH} after $MAX_ATTEMPTS attempts"
            exit 1
          fi

          STAPLE_OUTPUT=$(xcrun stapler staple "$BINARY_PATH" 2>&1) || true
          if echo "$STAPLE_OUTPUT" | grep -q "The staple and validate action worked"; then
            echo "  Notarization ticket stapled"
          else
            echo "  Stapling not supported for bare Mach-O CLI tools (expected)"
          fi

          echo "All checks passed for ${RELEASE_ARCH}"

      - name: Verify signed macOS sandbox check in a direct-home live profile
        env:
          XCSH_TEST_SANDBOX_CHECK_BINARY: ${{ github.workspace }}/packages/coding-agent/binaries/xcsh-darwin-${{ matrix.arch }}
        run: bun test packages/coding-agent/test/sandbox-check.test.ts

      - name: Upload signed macOS binary
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries-macos-${{ matrix.arch }}-signed
          path: packages/coding-agent/binaries/*
          if-no-files-found: error

  # Collect all artifacts and create the GitHub Release
  create-release:
    name: Publish immutable GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-release, build-sign-macos]
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Setup Bun 1.3
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"
      - name: Download Linux/Windows binaries
        uses: actions/download-artifact@v8
        with:
          name: release-binaries-linux-win
          path: packages/coding-agent/binaries
      - name: Download signed macOS binaries
        uses: actions/download-artifact@v8
        with:
          pattern: release-binaries-macos-*-signed
          path: packages/coding-agent/binaries
          merge-multiple: true
      - name: Build deterministic Homebrew archives twice
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]+$ ]] || exit 1
          export SOURCE_DATE_EPOCH
          bun scripts/ci-release-homebrew.ts --package-only
          sha256sum packages/coding-agent/binaries/*.zip packages/coding-agent/binaries/*.tar.gz \
            | LC_ALL=C sort > "$RUNNER_TEMP/homebrew-archives-first.sha256"
          bun scripts/ci-release-homebrew.ts --package-only
          sha256sum packages/coding-agent/binaries/*.zip packages/coding-agent/binaries/*.tar.gz \
            | LC_ALL=C sort > "$RUNNER_TEMP/homebrew-archives-second.sha256"
          diff -u "$RUNNER_TEMP/homebrew-archives-first.sha256" \
            "$RUNNER_TEMP/homebrew-archives-second.sha256"
      - name: List release binaries
        run: ls -la packages/coding-agent/binaries/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/immutable-releases" \
            | jq -e '.enabled == true' >/dev/null || {
            echo "::error::Repository release immutability is not enabled"
            exit 1
          }
          gh release create "$REF_NAME" packages/coding-agent/binaries/* --generate-notes
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${REF_NAME}" \
            | jq -e '.draft == false and .prerelease == false and .immutable == true' >/dev/null || {
            echo "::error::Created GitHub release is not final and immutable"
            exit 1
          }

  # Package Homebrew archives from signed binaries and update the tap
  update-homebrew:
    name: Publish Homebrew formula
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Setup Bun 1.3
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        id: setup-bun
        continue-on-error: true
        with:
          bun-version: "1.3"
      - name: Retry Bun setup on failure
        if: steps.setup-bun.outcome == 'failure'
        shell: bash
        run: |
          BUN_VERSION=$(curl -sSf "https://api.github.com/repos/oven-sh/bun/releases" \
            -H "Accept: application/vnd.github+json" \
            | grep -o '"tag_name": "bun-v1\.3\.[0-9]*"' \
            | head -1 \
            | grep -o '1\.3\.[0-9]*') || true
          if [ -z "$BUN_VERSION" ]; then
            echo "::warning::Could not resolve latest 1.3.x, falling back to 1.3.13"
            BUN_VERSION=1.3.13
          fi
          echo "Resolved Bun version: $BUN_VERSION"
          case "$RUNNER_OS" in
            Linux)  PLATFORM="linux-x64" ;;
            macOS)
              case "$RUNNER_ARCH" in
                ARM64) PLATFORM="darwin-aarch64" ;;
                *)     PLATFORM="darwin-x64" ;;
              esac ;;
            Windows) PLATFORM="windows-x64" ;;
          esac
          URL="https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-${PLATFORM}.zip"
          OUTFILE="bun-download.zip"
          echo "::warning::setup-bun action failed, retrying manual download from $URL"
          MAX_RETRIES=3
          DELAY=15
          for attempt in $(seq 1 $MAX_RETRIES); do
            if curl -sSfL --connect-timeout 15 --max-time 120 "$URL" -o "$OUTFILE"; then
              break
            fi
            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              echo "::error::Failed to download Bun after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Download attempt $attempt/$MAX_RETRIES failed, retrying in ${DELAY}s..."
            sleep $DELAY
            DELAY=$((DELAY * 2))
          done
          unzip -q "$OUTFILE"
          rm -f "$OUTFILE"
          BUN_DIR="$PWD/bun-${PLATFORM}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BUN_DIR=$(cygpath -w "$BUN_DIR")
          fi
          echo "$BUN_DIR" >> "$GITHUB_PATH"
          bun --version
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Download immutable Homebrew archives from release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --pattern 'xcsh-*.zip' \
            --pattern 'xcsh-*.tar.gz' \
            --dir packages/coding-agent/binaries
      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: bun scripts/ci-release-homebrew.ts --update-tap

  # Install from the published tap so a successful formula push cannot mask a
  # stale version, bad checksum, missing archive, or binary startup failure.
  verify-homebrew-install:
    name: Verify Homebrew installation
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [update-homebrew]
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun 1.3
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - name: Download signed native addon for the live-profile harness
        uses: actions/download-artifact@v8
        with:
          name: release-binaries-macos-arm64-signed
          path: packages/natives/native
      - name: Install published xcsh formula and verify startup
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail

          expected="${EXPECTED_VERSION#v}"
          max_attempts=8
          delay=10

          brew uninstall --force f5-sales-demo/tap/xcsh 2>/dev/null || true
          brew untap f5-sales-demo/tap 2>/dev/null || true

          for attempt in $(seq 1 "$max_attempts"); do
            echo "=== Homebrew install attempt $attempt/$max_attempts ==="

            # Re-clone the tap on every attempt so a stale local formula cannot
            # make a propagation retry install the previous release again.
            brew untap f5-sales-demo/tap 2>/dev/null || true
            brew tap f5-sales-demo/tap

            if brew install f5-sales-demo/tap/xcsh; then
              installed=$(xcsh --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
              echo "Installed version: ${installed:-unknown}; expected: $expected"

              if [ "$installed" = "$expected" ]; then
                xcsh --help >/dev/null
                xcsh sandbox check
                binary="$(brew --prefix f5-sales-demo/tap/xcsh)/bin/xcsh"
                codesign --verify --deep --strict "$binary"
                spctl --assess --verbose=4 --type install "$binary"
                XCSH_TEST_SANDBOX_CHECK_BINARY="$binary" \
                  bun test packages/coding-agent/test/sandbox-check.test.ts
                echo "Homebrew install verification passed"
                exit 0
              fi
            fi

            brew uninstall --force f5-sales-demo/tap/xcsh 2>/dev/null || true
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Homebrew install verification failed after $max_attempts attempts"
              exit 1
            fi

            echo "Waiting ${delay}s for tap and release-asset propagation..."
            sleep "$delay"
            if [ "$delay" -lt 60 ]; then delay=$((delay * 2)); fi
          done

  # Publish to npm
  publish-npm:
    name: Publish npm packages
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.skip_npm
    needs: [create-release]
    runs-on: ubuntu-22.04
    env:
      XCSH_BUILD_BRANCH: main
    permissions:
      id-token: write # Required for npm trusted-publishing provenance.
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          lfs: true
      - name: Setup Bun 1.3
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        id: setup-bun
        continue-on-error: true
        with:
          bun-version: "1.3"
      - name: Retry Bun setup on failure
        if: steps.setup-bun.outcome == 'failure'
        shell: bash
        run: |
          BUN_VERSION=$(curl -sSf "https://api.github.com/repos/oven-sh/bun/releases" \
            -H "Accept: application/vnd.github+json" \
            | grep -o '"tag_name": "bun-v1\.3\.[0-9]*"' \
            | head -1 \
            | grep -o '1\.3\.[0-9]*') || true
          if [ -z "$BUN_VERSION" ]; then
            echo "::warning::Could not resolve latest 1.3.x, falling back to 1.3.13"
            BUN_VERSION=1.3.13
          fi
          echo "Resolved Bun version: $BUN_VERSION"
          case "$RUNNER_OS" in
            Linux)  PLATFORM="linux-x64" ;;
            macOS)
              case "$RUNNER_ARCH" in
                ARM64) PLATFORM="darwin-aarch64" ;;
                *)     PLATFORM="darwin-x64" ;;
              esac ;;
            Windows) PLATFORM="windows-x64" ;;
          esac
          URL="https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-${PLATFORM}.zip"
          OUTFILE="bun-download.zip"
          echo "::warning::setup-bun action failed, retrying manual download from $URL"
          MAX_RETRIES=3
          DELAY=15
          for attempt in $(seq 1 $MAX_RETRIES); do
            if curl -sSfL --connect-timeout 15 --max-time 120 "$URL" -o "$OUTFILE"; then
              break
            fi
            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              echo "::error::Failed to download Bun after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Download attempt $attempt/$MAX_RETRIES failed, retrying in ${DELAY}s..."
            sleep $DELAY
            DELAY=$((DELAY * 2))
          done
          unzip -q "$OUTFILE"
          rm -f "$OUTFILE"
          BUN_DIR="$PWD/bun-${PLATFORM}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BUN_DIR=$(cygpath -w "$BUN_DIR")
          fi
          echo "$BUN_DIR" >> "$GITHUB_PATH"
          bun --version
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Download native addon artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pi-natives-*
          path: packages/natives/native
          merge-multiple: true
      - name: Stage native addons into platform packages
        run: |
          set -euo pipefail
          NATIVE_DIR="packages/natives/native"
          NPM_DIR="packages/natives/npm"
          cp "$NATIVE_DIR/pi_natives.linux-x64-baseline.node" "$NPM_DIR/linux-x64-gnu/"
          cp "$NATIVE_DIR/pi_natives.linux-x64-modern.node" "$NPM_DIR/linux-x64-gnu/"
          cp "$NATIVE_DIR/pi_natives.linux-arm64.node" "$NPM_DIR/linux-arm64-gnu/"
          cp "$NATIVE_DIR/pi_natives.darwin-x64-baseline.node" "$NPM_DIR/darwin-x64/"
          cp "$NATIVE_DIR/pi_natives.darwin-x64-modern.node" "$NPM_DIR/darwin-x64/"
          cp "$NATIVE_DIR/pi_natives.darwin-arm64.node" "$NPM_DIR/darwin-arm64/"
          cp "$NATIVE_DIR/pi_natives.win32-x64-baseline.node" "$NPM_DIR/win32-x64-msvc/"
          cp "$NATIVE_DIR/pi_natives.win32-x64-modern.node" "$NPM_DIR/win32-x64-msvc/"
          echo "Native addons staged into platform packages:"
          find "$NPM_DIR" -name "*.node" -exec ls -lh {} \;
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          bun run ci:release:publish

  # Verify npm install works end-to-end after publishing
  verify-npm-install:
    name: Verify npm installation
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-npm]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Setup Bun 1.3
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        id: setup-bun
        continue-on-error: true
        with:
          bun-version: "1.3"
      - name: Retry Bun setup on failure
        if: steps.setup-bun.outcome == 'failure'
        shell: bash
        run: |
          BUN_VERSION=$(curl -sSf "https://api.github.com/repos/oven-sh/bun/releases" \
            -H "Accept: application/vnd.github+json" \
            | grep -o '"tag_name": "bun-v1\.3\.[0-9]*"' \
            | head -1 \
            | grep -o '1\.3\.[0-9]*') || true
          if [ -z "$BUN_VERSION" ]; then
            echo "::warning::Could not resolve latest 1.3.x, falling back to 1.3.13"
            BUN_VERSION=1.3.13
          fi
          echo "Resolved Bun version: $BUN_VERSION"
          case "$RUNNER_OS" in
            Linux)  PLATFORM="linux-x64" ;;
            macOS)
              case "$RUNNER_ARCH" in
                ARM64) PLATFORM="darwin-aarch64" ;;
                *)     PLATFORM="darwin-x64" ;;
              esac ;;
            Windows) PLATFORM="windows-x64" ;;
          esac
          URL="https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-${PLATFORM}.zip"
          OUTFILE="bun-download.zip"
          echo "::warning::setup-bun action failed, retrying manual download from $URL"
          MAX_RETRIES=3
          DELAY=15
          for attempt in $(seq 1 $MAX_RETRIES); do
            if curl -sSfL --connect-timeout 15 --max-time 120 "$URL" -o "$OUTFILE"; then
              break
            fi
            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              echo "::error::Failed to download Bun after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Download attempt $attempt/$MAX_RETRIES failed, retrying in ${DELAY}s..."
            sleep $DELAY
            DELAY=$((DELAY * 2))
          done
          unzip -q "$OUTFILE"
          rm -f "$OUTFILE"
          BUN_DIR="$PWD/bun-${PLATFORM}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BUN_DIR=$(cygpath -w "$BUN_DIR")
          fi
          echo "$BUN_DIR" >> "$GITHUB_PATH"
          bun --version
      # The CLI under test is installed from the published registry artifact.
      # Workspace dependencies and the downloaded addon support only the
      # live-profile verification harness below.
      - run: bun install --frozen-lockfile
      - name: Download native addon for the live-profile harness
        uses: actions/download-artifact@v8
        with:
          name: release-binaries-linux-win
          path: packages/natives/native
      - name: Install xcsh via npm and verify native addon loads
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        # zizmor: ignore[adhoc-packages]
        run: |
          set -euo pipefail

          # Strip leading 'v' from tag to get semver (v17.0.0 -> 17.0.0)
          expected="${EXPECTED_VERSION#v}"
          max_attempts=8
          delay=10

          echo "Expected version: $expected"

          for attempt in $(seq 1 $max_attempts); do
            echo ""
            echo "=== Attempt $attempt/$max_attempts (backoff: ${delay}s) ==="

            # Clear any previously installed version
            npm uninstall -g @f5-sales-demo/xcsh 2>/dev/null || true
            npm cache clean --force 2>/dev/null || true

            # Install the specific version to avoid stale CDN cache
            if npm install -g "@f5-sales-demo/xcsh@${expected}" 2>&1; then
              installed=$(xcsh --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "unknown")
              echo "Installed version: $installed"

              if [ "$installed" = "$expected" ]; then
                echo "Version match confirmed."
                echo "Checking xcsh --help..."
                xcsh --help >/dev/null
                binary="$(command -v xcsh)"
                XCSH_TEST_SANDBOX_CHECK_BINARY="$binary" \
                  bun test packages/coding-agent/test/sandbox-check.test.ts
                echo "npm install verification passed"
                exit 0
              fi

              echo "Version mismatch: got $installed, expected $expected"
            else
              echo "npm install failed (exit $?)"
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "ERROR: verification failed after $max_attempts attempts"
              echo "Last installed version: ${installed:-none}"
              echo "Expected version: $expected"
              exit 1
            fi

            echo "Waiting ${delay}s for npm registry propagation..."
            sleep $delay
            delay=$((delay * 2))
          done
