---
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_native_matrix:
        description: "Qualify all native release platforms without publishing"
        type: boolean
        default: false
      skip_npm:
        description: "Skip npm publish"
        type: boolean
        default: false

# Read-only default; the three jobs that write already declare their own scopes
# (auto-release, create-release, publish-npm). Everything else either only builds
# and tests, or authenticates with RELEASE_TOKEN rather than GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never auto-cancel a tag run. The publishing chain (build-release ->
  # create-release -> publish-npm / update-homebrew -> install verification) lives in this workflow and
  # inherits this group, so a cancel between publish-npm and update-homebrew
  # would leave the version on npm with Homebrew stale and no rollback. All six
  # jobs were cancelled on the v19.96.0 run; that escaped harm only because the
  # cancel arrived before publish-npm did any work.
  #
  # refs/tags/vX.Y.Z is unique per tag, so an ordinary push cannot supersede it --
  # the realistic collision is ci-ensure-tag-release-run.ts dispatching the chain
  # after ~120s of polling, racing a run that only just became visible.
  #
  # main and PR branches keep cancelling: those collisions are frequent but cost
  # only latency, and a superseded auto-release is picked up by the next run.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  image-runtime:
    name: Bun image runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          no-cache: true
          bun-version: "1.4.2"
      # These tests use only Bun APIs and local modules, so they qualify the
      # replacement image pipeline on every runtime OS without native builds.
      - name: Verify image resizing, conversion and decode limits
        run: bun test --cwd packages/coding-agent test/utils/image-resize.test.ts test/utils/image-convert.test.ts

  check:
    name: check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcsh-socketless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify baked Bun
        run: bash scripts/verify-self-hosted-tools.sh bun
      - name: Restore Bun dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-1.4.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/bun.lock') }}
      - run: bash scripts/ci-bun-install.sh
      - name: Type check workspace
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run ci:check:full

  native-linux-x64:
    name: Native build (linux, x64, baseline and modern)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcsh-compute
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - name: Verify baked build toolchain
        run: bash scripts/verify-self-hosted-tools.sh full
      - name: Restore exact Rust cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: bash scripts/ci-bun-install.sh
      - name: Build baseline and modern native addons once
        env:
          TARGET_PLATFORM: linux
          TARGET_ARCH: x64
          TARGET_VARIANTS: baseline modern
        run: bun run ci:build:native
      - name: Create source-bound native manifest
        run: bun scripts/ci-native-manifest.ts create --source-sha "$GITHUB_SHA"
      - name: Sandbox self-test inside live bash profile
        run: bun test packages/coding-agent/test/sandbox-check.test.ts --max-concurrency=2
      - name: Upload verified Linux x64 natives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-natives-linux-x64-baseline-modern
          path: |
            packages/natives/native/pi_natives.linux-x64-baseline.node
            packages/natives/native/pi_natives.linux-x64-modern.node
            packages/natives/native/native-manifest.json
          if-no-files-found: error

  native:
    name: Native build (${{ matrix.os }}, ${{ matrix.arch }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.full_native_matrix)) && fromJSON('[
          {"os":"ubuntu-24.04","runner":"xcsh-compute","platform":"linux","arch":"arm64","target":"aarch64-unknown-linux-gnu"},
          {"os":"macos-15-intel","platform":"darwin","arch":"x64","variants":"baseline"},
          {"os":"macos-15-intel","platform":"darwin","arch":"x64","variants":"modern"},
          {"os":"macos-14","platform":"darwin","arch":"arm64","sandbox_check":true},
          {"os":"windows-latest","platform":"win32","arch":"x64","variants":"baseline"},
          {"os":"windows-latest","platform":"win32","arch":"x64","variants":"modern"}
          ]') || fromJSON('[
          {"os":"macos-14","platform":"darwin","arch":"arm64","sandbox_check":true}
          ]') }}
    runs-on: ${{ matrix.runner || matrix.os }}
    env:
      RUST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - name: Verify baked Linux build toolchain
        if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        run: bash scripts/verify-self-hosted-tools.sh full
      - name: Set up hosted Rust
        if: runner.environment != 'self-hosted' || runner.os != 'Linux'
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}
      - name: Set up hosted Bun 1.4.2
        if: runner.environment != 'self-hosted' || runner.os != 'Linux'
        uses: ./.github/actions/setup-bun
        with:
          no-cache: true
          bun-version: "1.4.2"
      - name: Set up hosted Zig 0.16.0
        if: runner.environment != 'self-hosted' || runner.os != 'Linux'
        uses: ./.github/actions/setup-zig
      - name: Restore exact Rust cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: bash scripts/ci-bun-install.sh
      - name: Build native addon(s)
        env:
          CROSS_TARGET: ${{ matrix.target }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_VARIANTS: ${{ matrix.variants }}
        run: bun run ci:build:native
      - name: Sandbox self-test inside live bash profile
        if: matrix.sandbox_check
        run: bun test packages/coding-agent/test/sandbox-check.test.ts --max-concurrency=2
      - name: Seatbelt sibling-customer enforcement
        if: matrix.platform == 'darwin' && matrix.sandbox_check
        run: bun test packages/coding-agent/test/sandbox-isolation.test.ts --max-concurrency=2
      - name: Upload native addon(s)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-natives-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.variants && format('-{0}', matrix.variants) || '' }}
          path: packages/natives/native/pi_natives.${{ matrix.platform }}-${{ matrix.arch }}*.node
          if-no-files-found: error

  test-rust:
    name: Rust tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcsh-compute
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify baked Rust toolchain
        run: bash scripts/verify-self-hosted-tools.sh full
      - name: Restore exact Rust cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Rust checks
        run: bun run check:rs
      - name: Containment fence tests
        run: cargo test -p containment-check
      - name: Landlock enforcement
        run: |
          cargo build -p containment-check
          cargo run -q -p containment-check -- status
          bash crates/containment-check/landlock-e2e.sh target/debug/containment-check
      - name: Test Rust workspaces
        run: bun run test:rs

  test-typescript:
    name: TypeScript tests
    needs: native-linux-x64
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcsh-compute
    timeout-minutes: 30
    env:
      XCSH_VERIFIED_NATIVE_MANIFEST: ${{ github.workspace }}/packages/natives/native/native-manifest.json
      XCSH_TEST_FILE_WORKERS: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: true
      - name: Verify baked TypeScript toolchain
        run: bash scripts/verify-self-hosted-tools.sh full
      - name: Download source-bound Linux x64 natives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pi-natives-linux-x64-baseline-modern
          path: packages/natives/native
      - name: Verify source-bound native manifest
        run: bun scripts/ci-native-manifest.ts verify --source-sha "$GITHUB_SHA"
      - name: Restore Bun dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-1.4.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/bun.lock') }}
      - run: bash scripts/ci-bun-install.sh
      - name: Test TypeScript workspaces
        run: bun run test:ts
      - name: CLI smoke test
        run: bun run ci:test:smoke

  test:
    name: test
    needs: [test-typescript, test-rust]
    runs-on: xcsh-socketless
    steps:
      - run: echo "TypeScript and Rust test shards passed"

  install_methods:
    name: Test installation methods
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcsh-socketless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - name: Setup Bun 1.4.2
        uses: ./.github/actions/setup-bun
        id: setup-bun
        with:
          no-cache: true
          bun-version: "1.4.2"
      - name: Retry Bun setup on failure
        if: (runner.environment != 'self-hosted' || runner.os != 'Linux') && steps.setup-bun.outcome == 'failure'
        shell: bash
        run: |
          BUN_VERSION=1.4.2
          echo "Using pinned Bun version: $BUN_VERSION"
          case "$RUNNER_OS" in
            Linux)  PLATFORM="linux-x64" ;;
            macOS)
              case "$RUNNER_ARCH" in
                ARM64) PLATFORM="darwin-aarch64" ;;
                *)     PLATFORM="darwin-x64" ;;
              esac ;;
            Windows) PLATFORM="windows-x64" ;;
          esac
          URL="https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-${PLATFORM}.zip"
          OUTFILE="bun-download.zip"
          echo "::warning::setup-bun action failed, retrying manual download from $URL"
          MAX_RETRIES=3
          DELAY=15
          for attempt in $(seq 1 $MAX_RETRIES); do
            if curl -sSfL --connect-timeout 15 --max-time 120 "$URL" -o "$OUTFILE"; then
              break
            fi
            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              echo "::error::Failed to download Bun after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Download attempt $attempt/$MAX_RETRIES failed, retrying in ${DELAY}s..."
            sleep $DELAY
            DELAY=$((DELAY * 2))
          done
          unzip -q "$OUTFILE"
          rm -f "$OUTFILE"
          BUN_DIR="$PWD/bun-${PLATFORM}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BUN_DIR=$(cygpath -w "$BUN_DIR")
          fi
          echo "$BUN_DIR" >> "$GITHUB_PATH"
          bun --version
      - uses: ./.github/actions/setup-rust
      - name: Restore exact Rust cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Setup Zig 0.16.0
        uses: ./.github/actions/setup-zig
      - name: Cache bun dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-1.4.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/bun.lock') }}
      - name: Verify immutable runner dependencies
        run: |
          command -v fd
          command -v rg
          command -v magick
          dpkg-query -W libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev >/dev/null
      - run: bash scripts/ci-bun-install.sh
      - name: Install method smoke tests
        run: bun run ci:test:install-methods

  # Invalidate already-green release PRs immediately when their recorded base
  # falls behind main. Release creation remains in auto-release after full CI.
  invalidate-stale-release-prs:
    environment: release
    name: Invalidate stale release pull requests
    if: github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore:')
    runs-on: xcsh-socketless
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Setup Bun 1.4.2
        uses: ./.github/actions/setup-bun
        with:
          no-cache: true
          bun-version: "1.4.2"
      - name: Close release PRs based on stale main
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: bun scripts/release.ts invalidate-stale

  auto-release:
    environment: release
    name: Prepare automatic release
    if: github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore:')
    needs: [check, native, test, install_methods]
    runs-on: xcsh-socketless
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0
      - name: Setup Bun 1.4.2
        uses: ./.github/actions/setup-bun
        id: setup-bun
        with:
          no-cache: true
          bun-version: "1.4.2"
      - name: Retry Bun setup on failure
        if: (runner.environment != 'self-hosted' || runner.os != 'Linux') && steps.setup-bun.outcome == 'failure'
        shell: bash
        run: |
          BUN_VERSION=1.4.2
          echo "Using pinned Bun version: $BUN_VERSION"
          case "$RUNNER_OS" in
            Linux)  PLATFORM="linux-x64" ;;
            macOS)
              case "$RUNNER_ARCH" in
                ARM64) PLATFORM="darwin-aarch64" ;;
                *)     PLATFORM="darwin-x64" ;;
              esac ;;
            Windows) PLATFORM="windows-x64" ;;
          esac
          URL="https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-${PLATFORM}.zip"
          OUTFILE="bun-download.zip"
          echo "::warning::setup-bun action failed, retrying manual download from $URL"
          MAX_RETRIES=3
          DELAY=15
          for attempt in $(seq 1 $MAX_RETRIES); do
            if curl -sSfL --connect-timeout 15 --max-time 120 "$URL" -o "$OUTFILE"; then
              break
            fi
            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              echo "::error::Failed to download Bun after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Download attempt $attempt/$MAX_RETRIES failed, retrying in ${DELAY}s..."
            sleep $DELAY
            DELAY=$((DELAY * 2))
          done
          unzip -q "$OUTFILE"
          rm -f "$OUTFILE"
          BUN_DIR="$PWD/bun-${PLATFORM}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BUN_DIR=$(cygpath -w "$BUN_DIR")
          fi
          echo "$BUN_DIR" >> "$GITHUB_PATH"
          bun --version
      - name: Cache bun dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-1.4.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/bun.lock') }}
      - run: bash scripts/ci-bun-install.sh
      - name: Verify spoofed client versions before release
        run: bun run check-spoofed-versions
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Configure scoped GitHub Git credentials
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: gh auth setup-git
      - name: Auto-detect version and release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: bun scripts/release.ts auto

  # Build Linux + Windows binaries on Ubuntu
  build-release:
    environment: release
    name: Build Linux and Windows release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, native, test, install_methods]
    runs-on: xcsh-compute
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ secrets.RELEASE_TOKEN }}
          lfs: true
      - name: Setup Bun 1.4.2
        uses: ./.github/actions/setup-bun
        id: setup-bun
        with:
          no-cache: true
          bun-version: "1.4.2"
      - name: Retry Bun setup on failure
        if: (runner.environment != 'self-hosted' || runner.os != 'Linux') && steps.setup-bun.outcome == 'failure'
        shell: bash
        run: |
          BUN_VERSION=1.4.2
          echo "Using pinned Bun version: $BUN_VERSION"
          case "$RUNNER_OS" in
            Linux)  PLATFORM="linux-x64" ;;
            macOS)
              case "$RUNNER_ARCH" in
                ARM64) PLATFORM="darwin-aarch64" ;;
                *)     PLATFORM="darwin-x64" ;;
              esac ;;
            Windows) PLATFORM="windows-x64" ;;
          esac
          URL="https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-${PLATFORM}.zip"
          OUTFILE="bun-download.zip"
          echo "::warning::setup-bun action failed, retrying manual download from $URL"
          MAX_RETRIES=3
          DELAY=15
          for attempt in $(seq 1 $MAX_RETRIES); do
            if curl -sSfL --connect-timeout 15 --max-time 120 "$URL" -o "$OUTFILE"; then
              break
            fi
            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              echo "::error::Failed to download Bun after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Download attempt $attempt/$MAX_RETRIES failed, retrying in ${DELAY}s..."
            sleep $DELAY
            DELAY=$((DELAY * 2))
          done
          unzip -q "$OUTFILE"
          rm -f "$OUTFILE"
          BUN_DIR="$PWD/bun-${PLATFORM}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BUN_DIR=$(cygpath -w "$BUN_DIR")
          fi
          echo "$BUN_DIR" >> "$GITHUB_PATH"
          bun --version
      - name: Cache bun dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-1.4.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/bun.lock') }}
      - run: bash scripts/ci-bun-install.sh
      - name: Download native addons
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pi-natives-*
          path: packages/natives/native
          merge-multiple: true
      - name: Verify baked LLVM Mach-O inspection tools
        shell: bash
        run: |
          set -euo pipefail
          command -v llvm-nm
      - name: Verify native addons
        run: bun run ci:release:verify-natives
      - name: Build Linux and Windows binaries
        env:
          XCSH_BUILD_BRANCH: main # compiled binaries have no .git at runtime; pin branch at build time
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          XCSH_VERTEX_OAUTH_CLIENT_ID: ${{ secrets.XCSH_VERTEX_OAUTH_CLIENT_ID }}
          XCSH_VERTEX_OAUTH_CLIENT_SECRET: ${{ secrets.XCSH_VERTEX_OAUTH_CLIENT_SECRET }}
        run: bun scripts/ci-release-build-binaries.ts --platform linux,win32
      - name: Verify compiled Linux sandbox check in a direct-home live profile
        env:
          XCSH_TEST_SANDBOX_CHECK_BINARY: ${{ github.workspace }}/packages/coding-agent/binaries/xcsh-linux-x64
        run: bun test packages/coding-agent/test/sandbox-check.test.ts
      - name: Stage native addons for release
        run: cp packages/natives/native/*.node packages/coding-agent/binaries/
      - name: Upload release binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries-linux-win
          path: packages/coding-agent/binaries/*
          if-no-files-found: error

  # Build macOS binaries natively on matching architecture, then sign and notarize
  build-sign-macos:
    environment: release
    name: Build and sign macOS (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, native, test, install_methods]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ secrets.RELEASE_TOKEN }}
          lfs: true
      - name: Setup Bun 1.4.2
        uses: ./.github/actions/setup-bun
        id: setup-bun
        continue-on-error: true
        with:
          no-cache: true
          bun-version: "1.4.2"
      - name: Retry Bun setup on failure
        if: (runner.environment != 'self-hosted' || runner.os != 'Linux') && steps.setup-bun.outcome == 'failure'
        shell: bash
        run: |
          BUN_VERSION=1.4.2
          echo "Using pinned Bun version: $BUN_VERSION"
          case "$RUNNER_OS" in
            Linux)  PLATFORM="linux-x64" ;;
            macOS)
              case "$RUNNER_ARCH" in
                ARM64) PLATFORM="darwin-aarch64" ;;
                *)     PLATFORM="darwin-x64" ;;
              esac ;;
            Windows) PLATFORM="windows-x64" ;;
          esac
          URL="https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-${PLATFORM}.zip"
          OUTFILE="bun-download.zip"
          echo "::warning::setup-bun action failed, retrying manual download from $URL"
          MAX_RETRIES=3
          DELAY=15
          for attempt in $(seq 1 $MAX_RETRIES); do
            if curl -sSfL --connect-timeout 15 --max-time 120 "$URL" -o "$OUTFILE"; then
              break
            fi
            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              echo "::error::Failed to download Bun after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Download attempt $attempt/$MAX_RETRIES failed, retrying in ${DELAY}s..."
            sleep $DELAY
            DELAY=$((DELAY * 2))
          done
          unzip -q "$OUTFILE"
          rm -f "$OUTFILE"
          BUN_DIR="$PWD/bun-${PLATFORM}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BUN_DIR=$(cygpath -w "$BUN_DIR")
          fi
          echo "$BUN_DIR" >> "$GITHUB_PATH"
          bun --version
      - name: Cache bun dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-1.4.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/bun.lock') }}
      - name: Install dependencies
        run: bash scripts/ci-bun-install.sh
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Download macOS native addons
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pi-natives-darwin-${{ matrix.arch }}*
          path: packages/natives/native
          merge-multiple: true
      # Sign + notarize the native addon BEFORE it is embedded into the compiled
      # binary. xcsh extracts the embedded .node to ~/.xcsh/natives/<ver>/ at
      # runtime; that extracted copy is a byte-for-byte image of what we embed, so
      # it only carries a notarized signature if the embedded .node was signed +
      # notarized here. Without this, managed/MDM Macs block the dlopen with
      # "pi_natives… could not verify it is free of malware".
      - name: Import Code Signing Certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          openssl pkcs12 -info -in "$RUNNER_TEMP/certificate.p12" -noout -passin pass:"$APPLE_CERTIFICATE_PASSWORD" || {
            echo "ERROR: Invalid p12 file or wrong password"
            exit 1
          }

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/certificate.p12"

          if [ -z "$APPLE_INSTALLER_CERTIFICATE_BASE64" ] || [ -z "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" ]; then
            echo "::error::A Developer ID Installer certificate is required for the stapled macOS package"
            exit 1
          fi
          echo "$APPLE_INSTALLER_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/installer-certificate.p12"
          openssl pkcs12 -info -in "$RUNNER_TEMP/installer-certificate.p12" -noout \
            -passin pass:"$APPLE_INSTALLER_CERTIFICATE_PASSWORD" >/dev/null
          security import "$RUNNER_TEMP/installer-certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productsign \
            -T /usr/bin/security
          rm "$RUNNER_TEMP/installer-certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          INSTALLER_SIGNING_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" \
            | grep "Developer ID Installer" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$INSTALLER_SIGNING_IDENTITY" ]; then
            echo "::error::No Developer ID Installer identity found"
            exit 1
          fi
          echo "INSTALLER_SIGNING_IDENTITY=$INSTALLER_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Sign and notarize native addons
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "::error::No Developer ID signing identity found for native addons"
            exit 1
          fi
          if [ "$APPLE_TEAM_ID" != "97ZYL78T5F" ] || [[ "$SIGNING_IDENTITY" != *"(97ZYL78T5F)"* ]]; then
            echo "::error::Release signing identity must use team 97ZYL78T5F"
            exit 1
          fi
          shopt -s nullglob
          NODES=(packages/natives/native/*.node)
          if [ ${#NODES[@]} -eq 0 ]; then
            echo "::error::No native (.node) addons found to sign in packages/natives/native"
            exit 1
          fi
          echo "Signing ${#NODES[@]} native addon(s) with: $SIGNING_IDENTITY"
          for node in "${NODES[@]}"; do
            codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$node"
            codesign --verify --deep --strict --verbose=2 "$node"
          done
          # Notarize the addon(s). A bare .node cannot be stapled, so the load relies
          # on Gatekeeper's online notarization check (cdhash registered with Apple).
          ZIP="$RUNNER_TEMP/natives-${RELEASE_ARCH}.zip"
          ditto -c -k packages/natives/native "$ZIP"
          NOTARY_OUTPUT=$(xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --output-format json)
          echo "$NOTARY_OUTPUT"
          jq -e '.status == "Accepted"' <<<"$NOTARY_OUTPUT" >/dev/null

      # Hard gate before embedding: exact team, runtime, timestamp, no entitlements,
      # strict signature verification, and an accepted notarization assessment.
      - name: Verify native addons are signed + notarized
        run: bun run ci:release:verify-native-signing

      - name: Build macOS binary
        env:
          XCSH_BUILD_BRANCH: main # compiled binaries have no .git at runtime; pin branch at build time
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          XCSH_VERTEX_OAUTH_CLIENT_ID: ${{ secrets.XCSH_VERTEX_OAUTH_CLIENT_ID }}
          XCSH_VERTEX_OAUTH_CLIENT_SECRET: ${{ secrets.XCSH_VERTEX_OAUTH_CLIENT_SECRET }}
        run: bun scripts/ci-release-build-binaries.ts --platform darwin --arch "$RELEASE_ARCH"
      - name: Stage macOS native addons for release
        run: cp packages/natives/native/*.node packages/coding-agent/binaries/

      # Cert already imported above (before the build, so the native addon could be
      # signed + notarized prior to embedding). Reuse that keychain here.
      - name: Sign macOS Binary
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "ERROR: No Developer ID signing identity found"
            exit 1
          fi
          if [ "$APPLE_TEAM_ID" != "97ZYL78T5F" ] || [[ "$SIGNING_IDENTITY" != *"(97ZYL78T5F)"* ]]; then
            echo "::error::Release signing identity must use team 97ZYL78T5F"
            exit 1
          fi
          echo "Using signing identity: $SIGNING_IDENTITY"

          BINARY_PATH="packages/coding-agent/binaries/xcsh-darwin-${RELEASE_ARCH}"
          if [ -f "$BINARY_PATH" ]; then
            file "$BINARY_PATH"
            lipo -info "$BINARY_PATH"
            # Sign directly over Bun's linker signature exactly once. Failure is fatal.
            codesign --force --options runtime \
              --entitlements scripts/entitlements.plist \
              --sign "$SIGNING_IDENTITY" \
              --timestamp "$BINARY_PATH"
            codesign --verify --deep --strict --verbose=2 "$BINARY_PATH"

            echo "${RELEASE_ARCH} signed successfully"
          else
            echo "::error::Binary not found: $BINARY_PATH"
            exit 1
          fi

      - name: Notarize macOS Binary
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          BINARY_PATH="packages/coding-agent/binaries/xcsh-darwin-${RELEASE_ARCH}"
          ZIP_PATH="$RUNNER_TEMP/xcsh-darwin-${RELEASE_ARCH}.zip"

          ditto -c -k --keepParent "$BINARY_PATH" "$ZIP_PATH"

          echo "Submitting ${RELEASE_ARCH} for notarization..."
          echo "Xcode path: $(xcode-select -p)"
          xcrun notarytool --version

          MAX_ATTEMPTS=3
          BACKOFF=30
          ATTEMPT=0
          NOTARIZE_OK=false

          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Notarization attempt $ATTEMPT/$MAX_ATTEMPTS..."
            NOTARY_EXIT=0
            NOTARY_OUTPUT=$(xcrun notarytool submit "$ZIP_PATH" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait --verbose 2>&1) || NOTARY_EXIT=$?
            echo "$NOTARY_OUTPUT"

            if echo "$NOTARY_OUTPUT" | grep -q "status: Accepted"; then
              echo "  Notarization accepted for ${RELEASE_ARCH} on attempt $ATTEMPT"
              NOTARIZE_OK=true
              break
            fi

            echo "::warning::Notarization attempt $ATTEMPT failed (exit $NOTARY_EXIT)"
            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "  Retrying in ${BACKOFF}s..."
              sleep "$BACKOFF"
              BACKOFF=$((BACKOFF * 2))
            fi
          done

          if [ "$NOTARIZE_OK" != "true" ]; then
            echo "::error::Notarization failed for ${RELEASE_ARCH} after $MAX_ATTEMPTS attempts"
            exit 1
          fi

          echo "All checks passed for ${RELEASE_ARCH}"

      - name: Capture immutable macOS payload provenance
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bun scripts/macos-release-provenance.ts create \
            --arch "$RELEASE_ARCH" \
            --version "$version" \
            --binary "packages/coding-agent/binaries/xcsh-darwin-${RELEASE_ARCH}" \
            --native-dir packages/coding-agent/binaries \
            --output "packages/coding-agent/binaries/xcsh-darwin-${RELEASE_ARCH}.provenance.json"
          bun scripts/macos-release-provenance.ts verify \
            --manifest "packages/coding-agent/binaries/xcsh-darwin-${RELEASE_ARCH}.provenance.json" \
            --root packages/coding-agent/binaries \
            --layout release

      - name: Build, sign, notarize, and staple macOS package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          binary="packages/coding-agent/binaries/xcsh-darwin-${RELEASE_ARCH}"
          pkg="packages/coding-agent/binaries/xcsh-darwin-${RELEASE_ARCH}.pkg"
          bun scripts/ci-release-macos-pkg.ts \
            --arch "$RELEASE_ARCH" \
            --version "$version" \
            --binary "$binary" \
            --native-dir packages/natives/native \
            --provenance "packages/coding-agent/binaries/xcsh-darwin-${RELEASE_ARCH}.provenance.json" \
            --output "$pkg"

          notary_accepted=false
          for attempt in 1 2 3; do
            notary_exit=0
            notary_output=$(xcrun notarytool submit "$pkg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait) || notary_exit=$?
            echo "$notary_output"
            if [ "$notary_exit" -eq 0 ] && echo "$notary_output" | grep -q "status: Accepted"; then
              notary_accepted=true
              break
            fi
            [ "$attempt" -eq 3 ] || sleep $((attempt * 30))
          done
          if [ "$notary_accepted" != true ]; then
            echo "::error::Package notarization was not accepted after 3 attempts"
            exit 1
          fi
          xcrun stapler staple "$pkg"
          xcrun stapler validate "$pkg"
          pkgutil --check-signature "$pkg" | grep -q "Developer ID Installer"
          spctl --assess --verbose=4 --type install "$pkg"
          expanded="$RUNNER_TEMP/xcsh-pkg-expanded-${RELEASE_ARCH}"
          pkgutil --expand-full "$pkg" "$expanded"
          bun scripts/macos-release-provenance.ts verify \
            --manifest "packages/coding-agent/binaries/xcsh-darwin-${RELEASE_ARCH}.provenance.json" \
            --root "$expanded/Payload" \
            --layout pkg

      - name: Verify signed macOS sandbox check in a direct-home live profile
        env:
          XCSH_TEST_SANDBOX_CHECK_BINARY: ${{ github.workspace }}/packages/coding-agent/binaries/xcsh-darwin-${{ matrix.arch }}
        run: bun test packages/coding-agent/test/sandbox-check.test.ts

      - name: Upload signed macOS binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries-macos-${{ matrix.arch }}-signed
          path: packages/coding-agent/binaries/*
          if-no-files-found: error

  # Collect all artifacts and create the GitHub Release
  create-release:
    environment: release
    name: Publish immutable GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-release, build-sign-macos]
    # This job performs strict codesign verification after archive assembly.
    # Keep it on macOS; Linux cannot validate Developer ID signatures.
    runs-on: macos-14
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Setup Bun 1.4.2
        uses: ./.github/actions/setup-bun
        with:
          no-cache: true
          bun-version: "1.4.2"
      - name: Download Linux/Windows binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries-linux-win
          path: packages/coding-agent/binaries
      - name: Download signed macOS binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-binaries-macos-*-signed
          path: packages/coding-agent/binaries
          merge-multiple: true
      - name: Build deterministic macOS Homebrew archives twice
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]+$ ]] || exit 1
          export SOURCE_DATE_EPOCH
          bun scripts/ci-release-homebrew.ts --package-only
          shasum -a 256 packages/coding-agent/binaries/*.zip \
            | LC_ALL=C sort > "$RUNNER_TEMP/homebrew-archives-first.sha256"
          bun scripts/ci-release-homebrew.ts --package-only
          shasum -a 256 packages/coding-agent/binaries/*.zip \
            | LC_ALL=C sort > "$RUNNER_TEMP/homebrew-archives-second.sha256"
          diff -u "$RUNNER_TEMP/homebrew-archives-first.sha256" \
            "$RUNNER_TEMP/homebrew-archives-second.sha256"
          for arch in arm64 x64; do
            root="$RUNNER_TEMP/homebrew-${arch}"
            mkdir "$root"
            unzip -q "packages/coding-agent/binaries/xcsh-darwin-${arch}.zip" -d "$root"
            bun scripts/macos-release-provenance.ts verify \
              --manifest "$root/provenance/manifest.json" \
              --root "$root" \
              --layout homebrew
          done
      - name: List release binaries
        run: ls -la packages/coding-agent/binaries/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/immutable-releases" \
            | jq -e '.enabled == true' >/dev/null || {
            echo "::error::Repository release immutability is not enabled"
            exit 1
          }
          gh release create "$REF_NAME" packages/coding-agent/binaries/* --generate-notes
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${REF_NAME}" \
            | jq -e '.draft == false and .prerelease == false and .immutable == true' >/dev/null || {
            echo "::error::Created GitHub release is not final and immutable"
            exit 1
          }

  # Publish the macOS binary cask from the signed archives
  update-homebrew:
    environment: release
    name: Publish Homebrew cask
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release]
    # Downloaded cask archives are re-verified with strict codesign checks.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Setup Bun 1.4.2
        uses: ./.github/actions/setup-bun
        id: setup-bun
        with:
          no-cache: true
          bun-version: "1.4.2"
      - name: Retry Bun setup on failure
        if: (runner.environment != 'self-hosted' || runner.os != 'Linux') && steps.setup-bun.outcome == 'failure'
        shell: bash
        run: |
          BUN_VERSION=1.4.2
          echo "Using pinned Bun version: $BUN_VERSION"
          case "$RUNNER_OS" in
            Linux)  PLATFORM="linux-x64" ;;
            macOS)
              case "$RUNNER_ARCH" in
                ARM64) PLATFORM="darwin-aarch64" ;;
                *)     PLATFORM="darwin-x64" ;;
              esac ;;
            Windows) PLATFORM="windows-x64" ;;
          esac
          URL="https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-${PLATFORM}.zip"
          OUTFILE="bun-download.zip"
          echo "::warning::setup-bun action failed, retrying manual download from $URL"
          MAX_RETRIES=3
          DELAY=15
          for attempt in $(seq 1 $MAX_RETRIES); do
            if curl -sSfL --connect-timeout 15 --max-time 120 "$URL" -o "$OUTFILE"; then
              break
            fi
            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              echo "::error::Failed to download Bun after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Download attempt $attempt/$MAX_RETRIES failed, retrying in ${DELAY}s..."
            sleep $DELAY
            DELAY=$((DELAY * 2))
          done
          unzip -q "$OUTFILE"
          rm -f "$OUTFILE"
          BUN_DIR="$PWD/bun-${PLATFORM}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BUN_DIR=$(cygpath -w "$BUN_DIR")
          fi
          echo "$BUN_DIR" >> "$GITHUB_PATH"
          bun --version
      - name: Cache bun dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-1.4.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/bun.lock') }}
      - run: bash scripts/ci-bun-install.sh
      - name: Download immutable macOS Homebrew archives from release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --pattern 'xcsh-*.zip' \
            --dir packages/coding-agent/binaries
      - name: Verify downloaded archive provenance
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            root="$RUNNER_TEMP/downloaded-homebrew-${arch}"
            mkdir "$root"
            unzip -q "packages/coding-agent/binaries/xcsh-darwin-${arch}.zip" -d "$root"
            bun scripts/macos-release-provenance.ts verify \
              --manifest "$root/provenance/manifest.json" \
              --root "$root" \
              --layout homebrew
          done
      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: bun scripts/ci-release-homebrew.ts --update-tap

  # Install from the published tap so a successful cask push cannot mask a stale
  # version, bad checksum, rewritten payload, signature failure, or native-load failure.
  verify-homebrew-install:
    name: Verify no-sudo Homebrew cask (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [update-homebrew]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare writable Homebrew for a standard account
        env:
          UAT_USER: xcsh-uat
        run: |
          set -euo pipefail
          uat_home="/Users/${UAT_USER}"
          UAT_HOME="$uat_home" UAT_FULL_NAME="xcsh Homebrew UAT" \
            bash scripts/ci-macos-uat-user.sh
          brew_prefix=$(brew --prefix)
          sudo mkdir -p "$uat_home/tmp"
          sudo cp scripts/ci-verify-homebrew-cask.sh "$uat_home/ci-verify-homebrew-cask.sh"
          sudo cp scripts/ci-homebrew-upgrade-fixture.sh "$uat_home/ci-homebrew-upgrade-fixture.sh"
          sudo chown -R "$UAT_USER":staff "$uat_home" "$brew_prefix"
          {
            echo "UAT_USER=$UAT_USER"
            echo "UAT_HOME=$uat_home"
            echo "UAT_BREW_PREFIX=$brew_prefix"
          } >> "$GITHUB_ENV"
      - name: Install, upgrade, and uninstall the published cask without sudo
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
          RELEASE_ARCH: ${{ matrix.arch }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          sudo -H -u "$UAT_USER" env \
            EXPECTED_VERSION="$EXPECTED_VERSION" \
            RELEASE_ARCH="$RELEASE_ARCH" \
            HOMEBREW_NO_AUTO_UPDATE="$HOMEBREW_NO_AUTO_UPDATE" \
            TMPDIR="$UAT_HOME/tmp" \
            PATH="$UAT_BREW_PREFIX/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            /bin/bash "$UAT_HOME/ci-verify-homebrew-cask.sh"

  verify-macos-pkg:
    name: Verify direct MDM package (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          no-cache: true
          bun-version: "1.4.2"
      - name: Download immutable MDM package and provenance
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --pattern "xcsh-darwin-${{ matrix.arch }}.pkg" \
            --pattern "xcsh-darwin-${{ matrix.arch }}.provenance.json" \
            --dir "$RUNNER_TEMP"
      - name: Install as the MDM channel and run as a clean standard user
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
          RELEASE_ARCH: ${{ matrix.arch }}
          PKG_PATH: ${{ runner.temp }}/xcsh-darwin-${{ matrix.arch }}.pkg
          PROVENANCE_PATH: ${{ runner.temp }}/xcsh-darwin-${{ matrix.arch }}.provenance.json
        run: bash scripts/ci-verify-macos-pkg.sh

  # Publish to npm
  publish-npm:
    environment: release
    name: Publish npm packages
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.skip_npm
    needs: [create-release]
    runs-on: xcsh-socketless
    env:
      XCSH_BUILD_BRANCH: main
    permissions:
      id-token: write # Required for npm trusted-publishing provenance.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ secrets.RELEASE_TOKEN }}
          lfs: true
      - name: Setup Bun 1.4.2
        uses: ./.github/actions/setup-bun
        id: setup-bun
        with:
          no-cache: true
          bun-version: "1.4.2"
      - name: Retry Bun setup on failure
        if: (runner.environment != 'self-hosted' || runner.os != 'Linux') && steps.setup-bun.outcome == 'failure'
        shell: bash
        run: |
          BUN_VERSION=1.4.2
          echo "Using pinned Bun version: $BUN_VERSION"
          case "$RUNNER_OS" in
            Linux)  PLATFORM="linux-x64" ;;
            macOS)
              case "$RUNNER_ARCH" in
                ARM64) PLATFORM="darwin-aarch64" ;;
                *)     PLATFORM="darwin-x64" ;;
              esac ;;
            Windows) PLATFORM="windows-x64" ;;
          esac
          URL="https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-${PLATFORM}.zip"
          OUTFILE="bun-download.zip"
          echo "::warning::setup-bun action failed, retrying manual download from $URL"
          MAX_RETRIES=3
          DELAY=15
          for attempt in $(seq 1 $MAX_RETRIES); do
            if curl -sSfL --connect-timeout 15 --max-time 120 "$URL" -o "$OUTFILE"; then
              break
            fi
            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              echo "::error::Failed to download Bun after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Download attempt $attempt/$MAX_RETRIES failed, retrying in ${DELAY}s..."
            sleep $DELAY
            DELAY=$((DELAY * 2))
          done
          unzip -q "$OUTFILE"
          rm -f "$OUTFILE"
          BUN_DIR="$PWD/bun-${PLATFORM}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BUN_DIR=$(cygpath -w "$BUN_DIR")
          fi
          echo "$BUN_DIR" >> "$GITHUB_PATH"
          bun --version
      - name: Verify runner Node.js
        run: node --version && npm --version
      - name: Cache bun dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-1.4.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/bun.lock') }}
      - run: bash scripts/ci-bun-install.sh
      - name: Download native addon artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pi-natives-*
          path: packages/natives/native
          merge-multiple: true
      - name: Stage native addons into platform packages
        run: |
          set -euo pipefail
          NATIVE_DIR="packages/natives/native"
          NPM_DIR="packages/natives/npm"
          cp "$NATIVE_DIR/pi_natives.linux-x64-baseline.node" "$NPM_DIR/linux-x64-gnu/"
          cp "$NATIVE_DIR/pi_natives.linux-x64-modern.node" "$NPM_DIR/linux-x64-gnu/"
          cp "$NATIVE_DIR/pi_natives.linux-arm64.node" "$NPM_DIR/linux-arm64-gnu/"
          cp "$NATIVE_DIR/pi_natives.darwin-x64-baseline.node" "$NPM_DIR/darwin-x64/"
          cp "$NATIVE_DIR/pi_natives.darwin-x64-modern.node" "$NPM_DIR/darwin-x64/"
          cp "$NATIVE_DIR/pi_natives.darwin-arm64.node" "$NPM_DIR/darwin-arm64/"
          cp "$NATIVE_DIR/pi_natives.win32-x64-baseline.node" "$NPM_DIR/win32-x64-msvc/"
          cp "$NATIVE_DIR/pi_natives.win32-x64-modern.node" "$NPM_DIR/win32-x64-msvc/"
          echo "Native addons staged into platform packages:"
          find "$NPM_DIR" -name "*.node" -exec ls -lh {} \;
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          bun run ci:release:publish

  # Verify npm install works end-to-end after publishing
  verify-npm-install:
    name: Verify npm installation
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-npm]
    runs-on: xcsh-socketless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify runner Node.js
        run: node --version && npm --version
      - name: Setup Bun 1.4.2
        uses: ./.github/actions/setup-bun
        id: setup-bun
        with:
          no-cache: true
          bun-version: "1.4.2"
      - name: Retry Bun setup on failure
        if: (runner.environment != 'self-hosted' || runner.os != 'Linux') && steps.setup-bun.outcome == 'failure'
        shell: bash
        run: |
          BUN_VERSION=1.4.2
          echo "Using pinned Bun version: $BUN_VERSION"
          case "$RUNNER_OS" in
            Linux)  PLATFORM="linux-x64" ;;
            macOS)
              case "$RUNNER_ARCH" in
                ARM64) PLATFORM="darwin-aarch64" ;;
                *)     PLATFORM="darwin-x64" ;;
              esac ;;
            Windows) PLATFORM="windows-x64" ;;
          esac
          URL="https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-${PLATFORM}.zip"
          OUTFILE="bun-download.zip"
          echo "::warning::setup-bun action failed, retrying manual download from $URL"
          MAX_RETRIES=3
          DELAY=15
          for attempt in $(seq 1 $MAX_RETRIES); do
            if curl -sSfL --connect-timeout 15 --max-time 120 "$URL" -o "$OUTFILE"; then
              break
            fi
            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              echo "::error::Failed to download Bun after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Download attempt $attempt/$MAX_RETRIES failed, retrying in ${DELAY}s..."
            sleep $DELAY
            DELAY=$((DELAY * 2))
          done
          unzip -q "$OUTFILE"
          rm -f "$OUTFILE"
          BUN_DIR="$PWD/bun-${PLATFORM}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BUN_DIR=$(cygpath -w "$BUN_DIR")
          fi
          echo "$BUN_DIR" >> "$GITHUB_PATH"
          bun --version
      # The CLI under test is installed from the published registry artifact.
      # Workspace dependencies and the downloaded addon support only the
      # live-profile verification harness below.
      - run: bash scripts/ci-bun-install.sh
      - name: Download native addon for the live-profile harness
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries-linux-win
          path: packages/natives/native
      - name: Install xcsh via npm and verify native addon loads
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: bash scripts/ci-verify-npm-install.sh

  trust-gate:
    name: Trust Docker-capable job
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-npm-install
    runs-on: xcsh-socketless
    permissions: {}
    steps:
      - name: Confirm this runner has no Docker socket
        run: test ! -S /run/docker.sock

  verify-npm-debian:
    name: Verify npm installation on Debian 12
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-npm-install, trust-gate]
    runs-on: xcsh-container-build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container
          name: xcsh-container-build-cache
          use: true
          cleanup: false
      - name: Install the published package in Debian 12 and load its native addon
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: bash scripts/ci-verify-npm-debian.sh
