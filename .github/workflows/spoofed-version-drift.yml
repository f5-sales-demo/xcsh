---
name: Spoofed Client Version Drift

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch: {}
  pull_request:
    paths:
      - "packages/ai/src/providers/anthropic.ts"
      - "packages/ai/src/providers/google-gemini-cli.ts"
      - "scripts/check-spoofed-versions.ts"
      - ".github/workflows/spoofed-version-drift.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check upstream client versions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Check Gemini CLI and Claude Code versions
        run: bun scripts/check-spoofed-versions.ts
