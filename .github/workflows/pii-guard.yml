---
# Zero-finding gate over the managed PII scanner.
#
# CLAUDE.md requires that repositories, fixtures, generated output and commit messages carry no real
# PII, and CONTRIBUTING.md documents a sweep procedure — but nothing ran that scanner automatically,
# which is how a batch of real customer names, a work email and a personal tenant identifier reached
# a public default branch.
#
# Every high-confidence enforcement finding fails this job. There is no baseline: operational and
# example data must be fixed at its source, and scanner false positives belong in docs-control.
name: pii-guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pii-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pii-guard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The scanner reads tracked blobs from the object database, not the worktree. The default
          # head scope does not need history.
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the gate's own behaviour before trusting its verdict
        run: bash tests/test-pii-gate.sh

      # The same entry point a developer runs as `bun run pii:gate`, so CI and local cannot drift.
      # It distinguishes findings (fail) from an invalid scan (also fail, loudly) and clean output.
      - name: Scan tracked content and require zero enforcement findings
        run: bash scripts/pii-gate.sh
