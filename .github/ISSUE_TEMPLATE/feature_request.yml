---
name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Desired capability and problem
      description: Who needs it, what problem does it solve, and what outcome is wanted?
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Give a concrete workflow and current behavior.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of xcsh does this relate to?
      options:
        - Provider / Model support
        - TUI / Display
        - Tools
        - MCP servers
        - Extensions / Plugins
        - CLI commands
        - Skills / Commands
        - Session management
        - Configuration
        - Other

  - type: textarea
    id: scope
    attributes:
      label: Scope and affected interfaces
      description: Name user flows, packages, CLI/API/plugin contracts, configuration, or documentation affected; state boundaries.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and dependencies
      description: State compatibility, security, privacy, platform, performance, release, and external-service constraints; link related issues or specs.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Objective acceptance criteria
      description: List observable conditions and expected results, including important failure behavior.
      placeholder: "- Given ..., when ..., then ..."
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification and traceability
      description: Map criteria to tests, UAT, CI, or documentation evidence; link related requirements and PRs.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: How would you implement this? Link to relevant docs or APIs if applicable.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds or other approaches you've tried?
