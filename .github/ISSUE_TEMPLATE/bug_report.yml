---
name: Bug Report
description: Report a bug or crash
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem and impact
      description: What happened, who is affected, and why does it matter?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: State both the expected result and what actually happened.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and affected interfaces
      description: Name affected commands, packages, APIs, plugins, configuration, or workflows; include boundaries.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and dependencies
      description: Note platform, compatibility, security, privacy, performance, release, or external service constraints; link related issues or specs.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Objective acceptance criteria
      description: List observable conditions and expected results, including important failure behavior.
      placeholder: "- Given ..., when ..., then ..."
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification and traceability
      description: Map each criterion to a reproducer, test, UAT, or CI check; link related requirements and PRs.
    validations:
      required: true

  - type: textarea
    id: error-output
    attributes:
      label: Error Output
      description: Paste sanitized error messages or stack traces; remove credentials and user data.
      render: shell

  - type: dropdown
    id: environment
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - Windows (native)
        - Windows (WSL)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: xcsh version
      description: Output of `xcsh --version`
      placeholder: "e.g. 12.1.0"
    validations:
      required: true

  - type: input
    id: bun-version
    attributes:
      label: Bun version
      description: Output of `bun --version`
      placeholder: "e.g. 1.3.8"
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider
      description: Which provider were you using? Leave blank if not provider-specific.
      options:
        - Anthropic (Claude Pro/Max)
        - ChatGPT Plus/Pro (Codex)
        - GitHub Copilot
        - Google Cloud Code Assist (Gemini CLI)
        - Cursor
        - OpenCode Zen
        - Kimi Code
        - Z.AI (GLM)
        - MiniMax Coding Plan
        - Perplexity
        - Amazon Bedrock
        - OpenRouter
        - Ollama / Local
        - Custom (models.yml)
        - Other

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of xcsh is affected?
      options:
        - TUI / Display
        - Authentication / Login
        - Model selection
        - Tool execution
        - MCP servers
        - Extensions / Plugins
        - CLI commands
        - Setup / Installation
        - Session / Compaction
        - Other

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Screenshots, config snippets, or other relevant information
