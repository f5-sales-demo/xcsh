[package]
name = "pi-natives"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
mimalloc = "=0.1.52"
tokio = { version = "=1.53.1", features = ["full"] }
tokio-util = { version = "=0.7.19", features = ["full"] }
napi = { version = "=3.10.3", features = ["napi10", "tokio_rt", "tokio_time"] }
napi-derive = "=3.5.9"
brush-core = { version = "0.5.0", path = "../brush-core-vendored" }
brush-builtins = { version = "0.2.0", path = "../brush-builtins-vendored" }
parking_lot = "=0.12.5"
dashmap = "=6.2.1"
clap = { version = "=4.6.6", features = ["derive"] }
os_pipe = "=1.2.3"
portable-pty = "=0.9.0"
grep-regex = "=0.1.14"
grep-searcher = "=0.1.17"
grep-matcher = "=0.1.9"
globset = "=0.4.20"
ignore = "=0.4.33"
rayon = "=1.12.0"
ast-grep-core = { version = "=0.39.9", default-features = false, features = [
   "tree-sitter",
] }
tree-sitter = "=0.25.10"
tree-sitter-astro = { version = "=0.1.1", package = "tree-sitter-astro-next" }
tree-sitter-bash = "=0.25.1"
tree-sitter-c = "=0.24.2"
tree-sitter-clojure = "=0.1.0"
tree-sitter-cmake = "=0.7.4"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-cpp = "=0.23.4"
tree-sitter-css = "=0.25.0"
tree-sitter-diff = "=0.1.0"
tree-sitter-dockerfile = { version = "=0.2.0", package = "tree-sitter-dockerfile-updated" }
tree-sitter-elixir = "=0.3.5"
tree-sitter-erlang = "=0.20.0"
tree-sitter-go = "=0.25.0"
tree-sitter-graphql = "=0.2.1"
tree-sitter-glimmer = "0.0.1"
tree-sitter-haskell = "=0.23.1"
tree-sitter-hcl = "=1.1.0"
tree-sitter-html = "=0.23.2"
tree-sitter-ini = "=1.4.0"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-json = "=0.24.8"
tree-sitter-just = "=0.2.0"
tree-sitter-julia = "=0.23.1"
tree-sitter-kotlin = { version = "=0.4.1", package = "tree-sitter-kotlin-sg" }
tree-sitter-lua = "=0.5.0"
tree-sitter-make = "=1.1.1"
tree-sitter-md = "=0.5.3"
tree-sitter-nix = "=0.3.0"
tree-sitter-objc = "=3.0.2"
tree-sitter-ocaml = "=0.25.0"
tree-sitter-odin = "=1.3.0"
ts-parser-perl = "=1.2.1"
tree-sitter-php = "=0.24.2"
tree-sitter-powershell = "=0.26.4"
tree-sitter-proto = "=0.5.0"
tree-sitter-python = "=0.25.0"
tree-sitter-r = "=1.3.0"
tree-sitter-regex = "=0.25.0"
tree-sitter-ruby = "=0.23.1"
tree-sitter-rust = "=0.24.2"
tree-sitter-scala = "=0.26.2"
tree-sitter-solidity = "=1.2.13"
tree-sitter-sql = { version = "=0.3.11", package = "tree-sitter-sequel" }
tree-sitter-starlark = "=1.3.0"
tree-sitter-svelte = { version = "=0.1.1", package = "tree-sitter-svelte-next" }
tree-sitter-swift = "=0.7.3"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-tlaplus = "=1.5.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-verilog = "=1.0.3"
tree-sitter-vue = { version = "=0.1.0", package = "tree-sitter-vue-next" }
tree-sitter-xml = "=0.7.0"
tree-sitter-yaml = "=0.7.2"
tree-sitter-zig = "=1.1.2"
inferno = { version = "=0.12.8", default-features = false }
image = { version = "=0.25.10", default-features = false, features = [
   "png",
   "jpeg",
   "gif",
   "webp",
] }
arboard = { version = "=3.6.1", features = ["wayland-data-control"] }
icy_sixel = "=0.6.0"
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"
syntect = { version = "=5.3.0", default-features = false, features = [
   "default-syntaxes",
   "default-themes",
   "regex-fancy",
] }
html-to-markdown-rs = { version = "=3.12.0", default-features = false }
phf = { version = "=0.14.0", features = ["macros"] }
smallvec = { version = "=1.16.0", features = [
   "serde",
   "write",
   "union",
   "const_new",
] }
memmap2 = "=0.9.11"
xxhash-rust = { version = "=0.8.18", features = ["xxh64"] }
regex = "=1.13.1"
similar = "=3.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
log = "=0.4.34"
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(windows)'.dependencies]
winreg = "=0.56.0"

windows-sys = { version = "=0.61.2", features = [
   "Win32_Foundation",
   "Win32_Storage_ProjectedFileSystem",
   "Win32_System_Com",
   "Win32_System_LibraryLoader",
   "Win32_System_Power",
] }
[build-dependencies]
napi-build = "=2.4.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
