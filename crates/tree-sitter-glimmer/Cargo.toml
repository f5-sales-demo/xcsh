[package]
name = "tree-sitter-glimmer"
description = "Glimmer grammar for tree-sitter"
version = "0.0.1"
license = "MIT"
repository = "https://github.com/ember-tooling/tree-sitter-glimmer"
edition = "2021"
build = "build.rs"
include = ["build.rs", "src/*"]

[lib]
path = "src/lib.rs"

[dependencies]
tree-sitter = ">=0.22.6"

[build-dependencies]
cc = "1"

# Standalone crate; avoid adopting an enclosing checkout workspace.
[workspace]
