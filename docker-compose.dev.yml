services:
  xcsh-dev:
    build:
      context: .
      dockerfile: Dockerfile.debian
      target: runtime
      args:
        XCSH_BUILD_COMMIT: ${XCSH_BUILD_COMMIT:-}
        XCSH_BUILD_BRANCH: ${XCSH_BUILD_BRANCH:-}
        XCSH_BUILD_TAG: ${XCSH_BUILD_TAG:-}
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: [/opt/xcsh/entrypoint.sh]
    command: [--help]
    working_dir: /workspace
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=1g,mode=1777
    volumes:
      - .:/workspace:ro
      - xcsh-private-state:/home/xcsh
    environment:
      HOME: /home/xcsh
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      VERTEX_AI_LOCATION: ${VERTEX_AI_LOCATION:-global}
      VERTEX_AI_PROJECT: ${VERTEX_AI_PROJECT:-}

volumes:
  xcsh-private-state:
